<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamOS // Neural Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --bg: #050505; 
            --ui-border: rgba(255,255,255,0.06); 
            --premium-ease: cubic-bezier(0.19, 1, 0.22, 1); 
        }
        body { background-color: var(--bg); color: #ededed; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; }
        
        /* Glass & Navigation */
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--ui-border); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .nav-item { transition: all 0.4s var(--premium-ease); color: #71717a; border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; transform: translateX(4px); }
        .nav-item.active { background: rgba(255,255,255,0.06); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
        @media (max-width: 768px) { .nav-item:hover { transform: translateY(-2px); } }
        
        /* Viewport Routing Transitions */
        #viewport { transition: opacity 0.6s var(--premium-ease), transform 0.6s var(--premium-ease); overflow-y: auto; position: relative; }
        .fade-out { opacity: 0; pointer-events: none; transform: scale(0.98); }
        .fade-in { opacity: 1; transform: scale(1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* Atmospheric Background */
        #atmospheric-orb { position: fixed; top: -20%; left: 30%; width: 800px; height: 800px; background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 60%); filter: blur(120px); z-index: -1; pointer-events: none; animation: breathe 10s ease-in-out infinite alternate; }

        /* Global Animation Classes for Archive & Analytics */
        .animate-slide-up { opacity: 0; transform: translateY(30px); filter: blur(5px); animation: slideFadeUp 0.8s var(--premium-ease) forwards; }
        .hover-card { transition: all 0.6s var(--premium-ease); }
        .hover-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 20px 40px rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.3); background: rgba(255,255,255,0.04); }

        /* --- ORB RECORD ENGINE CSS --- */
        .orb-stage { position: relative; width: 100%; max-width: 600px; height: 350px; display: flex; justify-content: center; align-items: center; margin: 0 auto; transition: all 1.2s var(--premium-ease); }
        .orb-core { position: absolute; width: 160px; height: 160px; border-radius: 50%; cursor: pointer; background: radial-gradient(circle at 35% 35%, #a78bfa, #6d28d9, #000); box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), inset 10px 10px 20px rgba(255,255,255,0.3), 0 0 50px rgba(139, 92, 246, 0.3); transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 10; }
        .orb-core.idle-float { animation: orb-float 6s ease-in-out infinite; transition: all 1.2s var(--premium-ease); }
        .orb-glow { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(139, 92, 246, 0.4), transparent, rgba(99, 102, 241, 0.4), transparent); filter: blur(25px); animation: orb-spin 10s linear infinite; transition: all 1.2s var(--premium-ease); pointer-events: none; z-index: 5; }
        .ripple { position: absolute; width: 160px; height: 160px; border-radius: 50%; border: 1px solid rgba(139, 92, 246, 0.6); opacity: 0; pointer-events: none; z-index: 4; }
        
        #orb-morph-ring { position: absolute; width: 100%; height: 100%; border: 2px solid #a78bfa; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 20; transform: scale(0.5); }

        /* Listening State */
        .is-listening .orb-core { background: radial-gradient(circle at 50% 50%, #c4b5fd, #7c3aed, #000); }
        .is-listening .orb-glow { width: 320px; height: 320px; filter: blur(40px) brightness(1.5); animation: orb-spin 4s linear infinite; }
        .is-listening .ripple-1 { animation: ripple-effect 2s linear infinite; }
        .is-listening .ripple-2 { animation: ripple-effect 2s linear infinite 1s; }

        /* Morphed State */
        .orb-stage.is-morphed { height: 440px; }
        .is-morphed .orb-core { width: 100%; height: 100%; border-radius: 32px; animation: none; background: rgba(20, 20, 25, 0.6); box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); cursor: default; transform: scale(1) !important; transition: all 1.2s var(--premium-ease); }
        .is-morphed .orb-glow { width: 110%; height: 110%; opacity: 0.2; filter: blur(70px); animation: orb-spin 30s linear infinite; }
        .is-morphed #orb-morph-ring { animation: morph-ring-boom 1s var(--premium-ease) forwards; }
        
        .morph-content { position: absolute; inset: 0; z-index: 20; padding: 2rem; display: flex; flex-direction: column; pointer-events: none; }
        .is-morphed .morph-content { pointer-events: all; }
        
        .reveal-item { opacity: 0; transform: translateY(20px); filter: blur(5px); }
        .is-morphed .reveal-item { animation: slideFadeUp 0.8s var(--premium-ease) forwards; }
        .is-morphed .delay-1 { animation-delay: 0.4s; } .is-morphed .delay-2 { animation-delay: 0.6s; } .is-morphed .delay-3 { animation-delay: 0.8s; }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .orb-stage.is-morphed { height: 100%; min-height: 400px; }
            .morph-content { padding: 1.25rem; }
            .orb-core { width: 130px; height: 130px; }
            .ripple { width: 130px; height: 130px; }
        }

        /* Cinematic Text Fade */
        .live-word { display: inline-block; animation: word-fade-in 0.5s var(--premium-ease) forwards; opacity: 0; filter: blur(8px); transform: translateY(6px); margin-right: 0.25em; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.3); }

        /* Keyframes */
        @keyframes orb-float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.02); } }
        @keyframes orb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes ripple-effect { 0% { width: 160px; height: 160px; opacity: 1; border-width: 2px; } 100% { width: 500px; height: 500px; opacity: 0; border-width: 0px; } }
        @keyframes slideFadeUp { 0% { opacity: 0; transform: translateY(30px); filter: blur(10px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
        @keyframes breathe { 0% { opacity: 0.5; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }
        @keyframes word-fade-in { to { opacity: 1; filter: blur(0); transform: translateY(0); } }
        @keyframes morph-ring-boom { 0% { opacity: 1; transform: scale(0.6); border-width: 4px; } 100% { opacity: 0; transform: scale(2.5); border-width: 0px; } }

    </style>
</head>
<body class="flex flex-col md:flex-row h-[100dvh] w-screen overflow-hidden">

    <div id="atmospheric-orb"></div>

    <aside class="w-full md:w-64 glass border-b md:border-b-0 md:border-r border-white/5 p-4 md:p-6 flex flex-row md:flex-col justify-between items-center md:items-stretch z-30 relative shrink-0">
        <div class="px-2 md:mb-10 flex items-center gap-3">
            <div class="w-5 h-5 md:w-6 md:h-6 rounded-full bg-gradient-to-tr from-violet-600 to-indigo-400 animate-pulse blur-[1px] shadow-[0_0_15px_rgba(139,92,246,0.5)]"></div>
            <h1 class="text-lg md:text-xl font-light tracking-tight text-white hidden md:block">DreamOS</h1>
        </div>
        <nav id="nav-menu" class="flex flex-row md:flex-col space-x-2 md:space-x-0 md:space-y-2 overflow-x-auto scrollbar-hide flex-1 md:flex-none justify-end md:justify-start">
            <a href="#" data-page="record" class="nav-item active"><i data-lucide="mic" class="w-4 h-4"></i> <span class="hidden md:inline">Log Your Dream</span></a>
            <a href="#" data-page="archive" class="nav-item"><i data-lucide="layers" class="w-4 h-4"></i> <span class="hidden md:inline">Dream journal</span></a>
            <a href="#" data-page="analytics" class="nav-item"><i data-lucide="activity" class="w-4 h-4"></i> <span class="hidden md:inline">Dream Analytics</span></a>
        </nav>
    </aside>

    <main id="viewport" class="flex-1 p-6 md:p-12 w-full h-full overflow-y-auto scrollbar-hide z-20 fade-in"></main>

<script>
    /** --- STORAGE & DATA ENGINE --- */
    const Store = {
        get() { try { const r = localStorage.getItem('dreams'); return r ? JSON.parse(r).map(d => this.normalize(d)) : []; } catch (e) { return []; } },
        save(d) { const ds = this.get(); ds.unshift(this.normalize(d)); localStorage.setItem('dreams', JSON.stringify(ds)); },
        delete(id) { const ds = this.get().filter(d => d.id !== id); localStorage.setItem('dreams', JSON.stringify(ds)); },
        getById(id) { return this.get().find(d => d.id == id); },
        normalize(d) {
            if (!d) d = {};
            return {
                id: d.id || Date.now(), createdAt: d.createdAt || new Date().toISOString(), title: d.title || 'Untitled Sequence', transcript: d.transcript || '', 
                analysis: { type: d.analysis?.type || 'Normal', emotions: Array.isArray(d.analysis?.emotions) ? d.analysis.emotions : [], people: Array.isArray(d.analysis?.people) ? d.analysis.people : [], locations: Array.isArray(d.analysis?.locations) ? d.analysis.locations : [] }, metadata: { deleted: !!d.metadata?.deleted }
            };
        }
    };

    /** --- ANALYTICS PROCESSING ENGINE --- */
    const PatternAnalyzer = {
        extract(dreams) {
            const p = { locations: {}, people: {}, emotions: {}, types: { Normal: 0, Lucid: 0, Nightmare: 0 } };
            dreams.forEach(d => {
                if (!d.analysis) return;
                const type = d.analysis.type;
                if(p.types[type] !== undefined) p.types[type]++; else p.types['Normal']++;
                ['emotions', 'locations', 'people'].forEach(cat => {
                    if (Array.isArray(d.analysis[cat])) {
                        d.analysis[cat].forEach(item => { 
                            if(item) { const norm = item.charAt(0).toUpperCase() + item.slice(1).toLowerCase(); p[cat][norm] = (p[cat][norm] || 0) + 1; }
                        });
                    }
                });
            });
            const sortMap = (map) => Object.entries(map).sort((a,b) => b[1] - a[1]).map(([name, count]) => ({name, count}));
            return { types: p.types, emotions: sortMap(p.emotions), locations: sortMap(p.locations), people: sortMap(p.people) };
        }
    };

    const AnalyticsEngine = {
        compute(searchQuery = '') {
            let db = Store.get().filter(d => !d.metadata?.deleted);
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                db = db.filter(d => (d.title && d.title.toLowerCase().includes(q)) || (d.transcript && d.transcript.toLowerCase().includes(q)));
            }
            return { data: { totalDreams: db.length, types: PatternAnalyzer.extract(db).types, patterns: PatternAnalyzer.extract(db) } };
        }
    };

    /** --- UI DISPLAY LAYER MODULES --- */
    
    // ANALYTICS VIEW
    const AnalyticsModule = {
        searchQuery: '',
        render() {
            const v = document.getElementById('viewport'); if(!v) return;
            const { data } = AnalyticsEngine.compute(this.searchQuery);
            
            v.innerHTML = `
                <div class="max-w-6xl mx-auto pb-24">
                    <div class="animate-slide-up" style="animation-delay: 0s">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 md:mb-12 border-b border-white/5 pb-6 md:pb-8 gap-4">
                            <div>
                                <h1 class="text-3xl md:text-4xl font-light tracking-tight text-white mb-2">Analytics</h1>
                                <p class="text-sm text-gray-500 tracking-wide">Data-driven mapping of your subconscious sequences.</p>
                            </div>
                            <div class="relative group w-full md:w-auto">
                                <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3 top-1/2 -translate-y-1/2 group-focus-within:text-violet-400 transition-colors"></i>
                                <input type="text" id="analytics-search" placeholder="Filter fragments..." value="${this.searchQuery}" 
                                    class="glass pl-10 pr-4 py-3 text-sm rounded-xl outline-none focus:border-violet-500/50 focus:shadow-[0_0_20px_rgba(139,92,246,0.15)] border border-white/5 w-full md:w-72 transition-all duration-500 placeholder-gray-600 bg-black/20">
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-12">
                        ${this.statCard("Total Archives", data.totalDreams, 0.1)}
                        ${this.statCard("Standard", data.types.Normal || 0, 0.2)}
                        ${this.statCard("Lucid Control", data.types.Lucid || 0, 0.3)}
                        ${this.statCard("Nightmares", data.types.Nightmare || 0, 0.4)}
                    </div>
                    
                    <div class="animate-slide-up mb-16" style="animation-delay: 0.5s">
                        <h2 class="text-lg font-light text-white mb-6 flex items-center gap-3"><i data-lucide="network" class="w-5 h-5 text-violet-400"></i> Frequent Manifestations</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${this.rankCard("Entities", data.patterns.people)}
                            ${this.rankCard("Locations", data.patterns.locations)}
                            ${this.rankCard("Emotional States", data.patterns.emotions)}
                        </div>
                    </div>
                </div>
            `;
            const searchInput = document.getElementById('analytics-search');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    this.searchQuery = e.target.value;
                    this.render();
                    const nextEl = document.getElementById('analytics-search');
                    if (nextEl) { nextEl.focus(); nextEl.setSelectionRange(nextEl.value.length, nextEl.value.length); }
                });
            }
            lucide.createIcons();
        },
        statCard(label, val, delay) { 
            return `<div class="glass p-4 md:p-6 rounded-2xl border border-white/5 animate-slide-up hover-card relative overflow-hidden" style="animation-delay: ${delay}s">
                        <div class="absolute top-0 right-0 w-16 h-16 md:w-24 md:h-24 bg-violet-500/10 rounded-bl-full blur-xl"></div>
                        <div class="text-[9px] md:text-[10px] uppercase tracking-widest text-violet-300/70 font-semibold">${label}</div>
                        <div class="text-3xl md:text-5xl font-light text-white line-height-1 mt-2">${val}</div>
                    </div>`; 
        },
        rankCard(title, arr) {
            return `
                <div class="glass p-6 md:p-7 rounded-3xl border border-white/5 relative overflow-hidden group hover:border-violet-500/20 transition-colors duration-500">
                    <div class="absolute -right-10 -top-10 w-40 h-40 bg-violet-600/5 rounded-full blur-3xl group-hover:bg-violet-600/10 transition-colors duration-700"></div>
                    <div class="text-[10px] md:text-xs uppercase tracking-widest mb-5 text-gray-400 border-b border-white/5 pb-3 font-semibold">${title}</div>
                    <div class="counter-reset-rank space-y-2">
                        ${arr.length ? arr.slice(0,5).map((i, idx) => `
                            <div class="flex justify-between items-center text-sm py-1.5 border-b border-white/5 last:border-0 hover:bg-white/5 px-2 -mx-2 rounded transition-colors">
                                <span class="flex items-center gap-3"><span class="text-violet-500 font-mono text-[10px]">0${idx+1}</span> <span class="text-gray-200">${i.name}</span></span> 
                                <span class="font-mono text-gray-500/80 bg-white/5 px-1.5 py-0.5 rounded text-xs">${i.count}</span>
                            </div>
                        `).join('') : '<div class="text-xs text-gray-600 py-4 italic">Insufficient data points.</div>'}
                    </div>
                </div>`;
        }
    };

    // ARCHIVE VIEW (Categorized)
    const ArchiveModule = {
        render() {
            const v = document.getElementById('viewport');
            const data = Store.get().filter(d => !d.metadata?.deleted);
            
            const categories = [
                { name: 'Lucid Control', type: 'Lucid', color: 'bg-cyan-400', border: 'border-cyan-500/20', bg: 'bg-cyan-900/20' },
                { name: 'Nightmares', type: 'Nightmare', color: 'bg-red-500', border: 'border-red-500/20', bg: 'bg-red-900/20' },
                { name: 'Standard Sequences', type: 'Normal', color: 'bg-violet-400', border: 'border-violet-500/20', bg: 'bg-violet-900/20' }
            ];

            let htmlContent = '';
            
            if (!data.length) {
                htmlContent = `<div class="col-span-full py-32 text-center text-gray-500 animate-slide-up font-light tracking-wide" style="animation-delay: 0.2s">The archive is currently void. Begin an uplink to store memories.</div>`;
            } else {
                categories.forEach((cat, index) => {
                    const items = data.filter(d => d.analysis?.type === cat.type);
                    if (items.length > 0) {
                        htmlContent += `
                            <div class="mb-14 animate-slide-up" style="animation-delay: ${index * 0.15}s">
                                <h3 class="text-xl font-light text-white mb-6 border-b border-white/10 pb-3 flex items-center gap-3">
                                    <span class="w-2 h-2 rounded-full ${cat.color} shadow-[0_0_10px_${cat.color.replace('bg-', '')}]"></span>
                                    ${cat.name}
                                    <span class="text-xs font-mono text-gray-500 ml-2">${items.length}</span>
                                </h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-6">
                                    ${items.map((d, i) => this.renderCard(d, i, cat)).join('')}
                                </div>
                            </div>
                        `;
                    }
                });
            }

            v.innerHTML = `
                <div class="max-w-6xl mx-auto pb-24">
                    <div class="mb-10 md:mb-14 animate-slide-up" style="animation-delay: 0s">
                        <h2 class="text-3xl md:text-4xl font-light tracking-tight text-white mb-2">Neural Collection</h2>
                        <p class="text-sm text-gray-500 tracking-wide">Browse serialized memory constructs.</p>
                    </div>
                    ${htmlContent}
                </div>
            `;
            lucide.createIcons();
        },
        renderCard(d, index, catTheme) {
            return `
                <div onclick="ArchiveModule.viewDetail(${d.id})" class="glass p-6 rounded-3xl border border-white/5 cursor-pointer hover-card flex flex-col justify-between group relative overflow-hidden" style="min-height: 200px;">
                    <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-5">
                            <span class="text-[9px] font-bold uppercase tracking-widest ${catTheme.color.replace('bg-','text-')} ${catTheme.bg} border ${catTheme.border} px-2.5 py-1 rounded-full shadow-lg">${d.analysis?.type}</span>
                            <span class="text-xs text-gray-600 font-mono">${d.createdAt ? new Date(d.createdAt).toLocaleDateString(undefined, {month:'short', day:'numeric'}) : ''}</span>
                        </div>
                        <h3 class="text-xl font-light mb-3 text-white line-clamp-1 group-hover:text-violet-200 transition-colors">${d.title}</h3>
                        <p class="text-sm text-gray-400 line-clamp-3 leading-relaxed">${d.transcript}</p>
                    </div>
                </div>
            `;
        },
        viewDetail(id) {
            const d = Store.getById(id); if (!d) return;
            const dateStr = d.createdAt ? new Date(d.createdAt).toLocaleString(undefined, {dateStyle: 'long', timeStyle: 'short'}) : '';
            
            document.getElementById('viewport').innerHTML = `
                <div class="max-w-3xl mx-auto pb-24">
                    <button onclick="Router.navigate('archive')" class="animate-slide-up mb-8 text-sm text-gray-400 hover:text-white flex items-center gap-2 group transition-colors px-4 py-2 glass rounded-full w-fit hover:border-white/20" style="animation-delay: 0s">
                        <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> Return to Modules
                    </button>
                    
                    <div class="glass p-8 md:p-12 rounded-[2.5rem] space-y-8 animate-slide-up border border-white/5 shadow-2xl relative overflow-hidden" style="animation-delay: 0.1s">
                        <div class="absolute -right-20 -top-20 w-80 h-80 bg-violet-600/10 rounded-full blur-[80px] pointer-events-none"></div>
                        
                        <div class="flex flex-col md:flex-row justify-between items-start border-b border-white/10 pb-8 relative z-10 gap-6">
                            <div>
                                <h1 class="text-3xl md:text-5xl font-light tracking-tight text-white mb-4 leading-tight">${d.title}</h1>
                                <div class="flex flex-wrap gap-3 items-center">
                                    <span class="text-[10px] font-bold uppercase tracking-widest text-violet-300 bg-violet-500/10 border border-violet-500/20 px-3 py-1.5 rounded-full">${d.analysis.type}</span>
                                    <span class="text-xs text-gray-500 font-mono"><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i>${dateStr}</span>
                                </div>
                            </div>
                            <button onclick="Store.delete(${d.id}); Router.navigate('archive');" class="p-3 glass rounded-full text-gray-500 hover:text-red-400 hover:bg-red-900/20 hover:border-red-500/30 transition-all duration-300">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                        
                        <div class="relative z-10">
                            <p class="text-gray-300 leading-loose text-base md:text-lg font-light tracking-wide">${d.transcript}</p>
                        </div>
                        
                        <div class="pt-8 border-t border-white/5 relative z-10 grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${this.tagGroup('Locations', d.analysis.locations, 'map-pin')}
                            ${this.tagGroup('Emotions', d.analysis.emotions, 'heart')}
                            ${this.tagGroup('Entities', d.analysis.people, 'users')}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        },
        tagGroup(title, items, icon) {
            if(!items || items.length === 0) return '';
            return `<div>
                <h4 class="text-[10px] uppercase tracking-widest text-gray-500 mb-3 flex items-center gap-2"><i data-lucide="${icon}" class="w-3 h-3"></i> ${title}</h4>
                <div class="flex flex-wrap gap-2">
                    ${items.map(i => `<span class="px-2.5 py-1 glass rounded-md text-xs text-gray-300 border-white/5 hover:border-violet-500/30 transition-colors cursor-default">${i}</span>`).join('')}
                </div>
            </div>`;
        }
    };

    /** --- RECORD PAGE (AUDIO REACTIVE + FADE-ON TEXT ENGINE) --- */
    const OrbEngine = {
        isRecording: false,
        recognition: null,
        finalTranscript: '',
        displayedWords: [],
        audioCtx: null,
        analyser: null,
        audioStream: null,
        
        init(el) {
            el.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center w-full">
                    <div id="orb-instructions" class="text-center space-y-6 mb-8 md:mb-12 transition-all duration-1000 ease-in-out animate-slide-up" style="animation-delay: 0.1s">
                        <h1 class="text-3xl md:text-4xl font-light tracking-tight text-white/90 drop-shadow-md">Let the dream speak...</h1>
                        <div class="glass px-6 md:px-8 py-5 rounded-3xl border border-white/5 max-w-lg mx-auto relative overflow-hidden group hover:border-violet-500/30 transition-colors duration-500 shadow-2xl hidden md:block">
                            <div class="absolute inset-0 bg-gradient-to-r from-violet-600/10 to-transparent opacity-50"></div>
                            <p class="text-sm text-gray-400 tracking-wide leading-relaxed text-left relative z-10">
                                <span class="flex items-center gap-2 text-[10px] text-violet-400 font-bold uppercase tracking-widest mb-3"><i data-lucide="info" class="w-3 h-3"></i> REQUREMENTS</span>
                                What was your dream? <span class="text-white font-medium drop-shadow"> Normal,  Lucid,  Nightmare</span>.<br>
                                For better results, state your <span class="text-white font-medium drop-shadow">Emotions</span> and <span class="text-white font-medium drop-shadow">Locations</span>.
                            </p>
                        </div>
                    </div>

                    <div id="orb-stage" class="orb-stage animate-slide-up" style="animation-delay: 0.3s">
                        <div class="ripple ripple-1"></div>
                        <div class="ripple ripple-2"></div>
                        <div class="orb-glow"></div>
                        
                        <div id="orb-morph-ring"></div>
                        
                        <div id="orb-core" class="orb-core idle-float flex items-center justify-center group" onclick="OrbEngine.toggle()">
                            <span id="orb-hint" class="text-[11px] font-medium text-white/60 group-hover:text-white uppercase tracking-widest transition duration-500 group-hover:scale-105 pointer-events-none">Tap to Initiate</span>
                        </div>
                        
                        <div class="morph-content">
                            <div class="reveal-item delay-1 flex justify-between items-end mb-4 border-b border-white/5 pb-4 md:pb-5">
                                <div>
                                    <h2 class="text-xl md:text-2xl font-light text-white tracking-tight">Memory Serialized</h2>
                                    <p class="text-[9px] md:text-[10px] text-violet-400 uppercase tracking-widest mt-1">Ready for extraction</p>
                                </div>
                                <i data-lucide="check-circle-2" class="w-5 h-5 md:w-6 md:h-6 text-violet-500"></i>
                            </div>
                            
                            <div class="reveal-item delay-2 flex-1 glass rounded-2xl p-4 md:p-6 overflow-y-auto mb-4 border-white/5 bg-black/40">
                                <p id="morph-transcript" class="text-gray-300 text-sm md:text-[15px] leading-relaxed font-light"></p>
                            </div>
                            
                            <button onclick="OrbEngine.saveAndRoute()" class="reveal-item delay-3 w-full py-3 md:py-4 rounded-xl bg-white text-black hover:bg-gray-200 font-medium transition-all duration-300 shadow-[0_0_40px_rgba(255,255,255,0.1)] flex items-center justify-center gap-3 group text-sm md:text-base">
                                <i data-lucide="database" class="w-4 h-4 group-hover:scale-110 transition-transform"></i> Commit to Archive
                            </button>
                        </div>
                    </div>

                    <div id="live-feedback" class="mt-8 md:mt-16 text-center text-xl md:text-2xl font-light text-gray-400 max-w-3xl h-24 md:h-32 overflow-hidden transition-all duration-700 opacity-0 px-4 translate-y-4"></div>
                </div>
            `;
            lucide.createIcons();
            this.isRecording = false;
            this.finalTranscript = '';
            this.displayedWords = [];
            
            const SpeechTarget = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechTarget) {
                document.getElementById('orb-hint').innerText = "API ERROR";
            } else {
                this.recognition = new SpeechTarget();
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                
                this.recognition.onresult = (e) => {
                    this.finalTranscript = Array.from(e.results).map(r => r[0].transcript).join('');
                    this.renderLiveText();
                };
            }
        },

        renderLiveText() {
            const fb = document.getElementById('live-feedback');
            if(!fb || !this.finalTranscript) return;
            
            const currentWords = this.finalTranscript.trim().split(/\s+/);
            
            // Diffing logic to animate only new words
            if (currentWords.length > this.displayedWords.length) {
                const newWords = currentWords.slice(this.displayedWords.length);
                newWords.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'live-word';
                    span.innerText = w;
                    fb.appendChild(span);
                    // Add space after
                    fb.appendChild(document.createTextNode(' '));
                });
                this.displayedWords = currentWords;
                // Auto scroll to bottom of container if text wraps
                fb.scrollTop = fb.scrollHeight;
            } else if (currentWords.length < this.displayedWords.length || (currentWords.length > 0 && currentWords[0] !== this.displayedWords[0])) {
                // If interim result overwrites completely (correction phase)
                fb.innerHTML = currentWords.map(w => `<span class="live-word" style="animation:none; opacity:1; filter:blur(0); transform:none;">${w}</span> `).join('');
                this.displayedWords = currentWords;
            } else if (currentWords.length === this.displayedWords.length) {
                // Just update the last word gently if it's changing in interim
                const lastSpan = fb.querySelector('.live-word:last-of-type');
                if(lastSpan) lastSpan.innerText = currentWords[currentWords.length - 1];
            }
        },

        async startAudioReactive() {
            try {
                if(!navigator.mediaDevices) return;
                this.audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioCtx.createAnalyser();
                this.analyser.fftSize = 256;
                const source = this.audioCtx.createMediaStreamSource(this.audioStream);
                source.connect(this.analyser);
                this.audioData = new Uint8Array(this.analyser.frequencyBinCount);
                this.tickAudio();
            } catch(err) {
                console.log("Audio visualizer skipped (no mic access for WebAudio)", err);
            }
        },

        tickAudio() {
            if(!this.isRecording) return;
            if(this.analyser && this.audioData) {
                this.analyser.getByteFrequencyData(this.audioData);
                let sum = 0; for(let i = 0; i < this.audioData.length; i++) sum += this.audioData[i];
                let avg = sum / this.audioData.length;
                
                const orb = document.getElementById('orb-core');
                if (orb && !document.getElementById('orb-stage').classList.contains('is-morphed')) {
                    // Reactive Scale & Shadow based on volume
                    const volumeScale = 1.05 + (avg / 256) * 0.35; 
                    orb.style.transform = `scale(${volumeScale})`;
                    orb.style.boxShadow = `inset -10px -10px 20px rgba(0,0,0,0.5), inset 10px 10px 20px rgba(255,255,255,0.7), 0 0 ${50 + avg}px rgba(139, 92, 246, ${0.4 + (avg/256)})`;
                }
            }
            requestAnimationFrame(() => this.tickAudio());
        },

        toggle() {
            if(document.getElementById('orb-stage').classList.contains('is-morphed')) return;
            if(!this.isRecording) this.start(); else this.stop();
        },

        start() {
            if(!this.recognition) return;
            this.isRecording = true;
            this.finalTranscript = '';
            this.displayedWords = [];
            
            const stage = document.getElementById('orb-stage');
            stage.classList.add('is-listening');
            
            const core = document.getElementById('orb-core');
            core.classList.remove('idle-float');
            
            document.getElementById('orb-hint').style.opacity = '0';
            
            const inst = document.getElementById('orb-instructions');
            inst.style.opacity = '0'; inst.style.transform = 'translateY(-30px)';
            
            const fb = document.getElementById('live-feedback');
            fb.innerHTML = '';
            fb.style.opacity = '1'; fb.style.transform = 'translateY(0)';
            
            // Start APIs
            this.startAudioReactive();
            try { this.recognition.start(); } catch(e) {}
        },

        stop() {
            this.isRecording = false;
            if(this.recognition) this.recognition.stop();
            
            // Stop Audio Context to free up mic
            if(this.audioStream) this.audioStream.getTracks().forEach(track => track.stop());
            if(this.audioCtx) this.audioCtx.close();
            
            const stage = document.getElementById('orb-stage');
            stage.classList.remove('is-listening');
            stage.classList.add('is-morphed'); 

            setTimeout(() => { document.getElementById('orb-instructions').style.display = 'none'; }, 500);
            document.getElementById('live-feedback').style.opacity = '0';
            
            document.getElementById('morph-transcript').innerText = this.finalTranscript || "No vocal data detected. The archive remains silent.";
        },

        saveAndRoute() {
            if (this.finalTranscript.trim()) {
                const text = this.finalTranscript.toLowerCase();
                
                const knownPlaces = ['paris', 'london', 'tokyo', 'new york', 'berlin', 'rome', 'house', 'school', 'beach', 'city', 'forest', 'ocean', 'street', 'office', 'room', 'car', 'mall', 'mountain', 'hospital', 'airport', 'hotel'];
                const knownEmotions = ['happy', 'sad', 'angry', 'scared', 'anxious', 'calm', 'confused', 'excited', 'terrified', 'joyful', 'frustrated', 'peaceful', 'panicked'];
                
                const extLocations = knownPlaces.filter(p => text.includes(p));
                const extEmotions = knownEmotions.filter(e => text.includes(e));
                
                const tokens = this.finalTranscript.split(/\s+/);
                for(let i = 0; i < tokens.length - 1; i++) {
                    const currentLower = tokens[i].toLowerCase();
                    if(['in', 'at', 'to', 'from', 'near'].includes(currentLower)) {
                        const nextWord = tokens[i+1].replace(/[^a-zA-Z]/g, '');
                        if(nextWord.length > 2 && nextWord[0] === nextWord[0].toUpperCase()) extLocations.push(nextWord.toLowerCase());
                    }
                }
                
                let detectedType = 'Normal';
                if(text.includes('lucid') || text.includes('control') || text.includes('aware')) detectedType = 'Lucid';
                else if(text.includes('nightmare') || text.includes('scared') || text.includes('terrified') || text.includes('monster') || text.includes('run')) detectedType = 'Nightmare';

                Store.save({
                    title: this.finalTranscript.slice(0, 35) + (this.finalTranscript.length > 35 ? '...' : ''), 
                    transcript: this.finalTranscript, 
                    analysis: {
                        type: detectedType,
                        people: this.extractNames(this.finalTranscript),
                        locations: [...new Set(extLocations)].map(p => p.charAt(0).toUpperCase() + p.slice(1)),
                        emotions: [...new Set(extEmotions)].map(p => p.charAt(0).toUpperCase() + p.slice(1))
                    }
                });
            }
            Router.navigate('archive');
        },

        extractNames(text) {
            if (!text) return [];
            const tokens = text.split(/\s+/);
            const names = [];
            for (let i = 1; i < tokens.length; i++) {
                const word = tokens[i].replace(/[^a-zA-Z]/g, '');
                if (word.length > 2 && word[0] === word[0].toUpperCase() && word.slice(1) === word.slice(1).toLowerCase()) {
                    names.push(word);
                }
            }
            return [...new Set(names)];
        }
    };

    /** --- GLOBAL ROUTER --- */
    const Router = {
        async navigate(pageId) {
            const v = document.getElementById('viewport'); if(!v) return;
            
            v.classList.remove('fade-in');
            v.classList.add('fade-out');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === pageId));
            
            await new Promise(r => setTimeout(r, 400));
            
            if (pageId === 'record') OrbEngine.init(v);
            else if (pageId === 'archive') ArchiveModule.render();
            else if (pageId === 'analytics') AnalyticsModule.render();
            
            // Small delay to ensure DOM paints before fade in
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    v.classList.remove('fade-out'); 
                    v.classList.add('fade-in');
                });
            });
        }
    };

    // Global Nav Listener
    document.getElementById('nav-menu').addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link && link.dataset.page) { 
            e.preventDefault(); 
            Router.navigate(link.dataset.page); 
        }
    });

    // Initialize System Viewport
    Router.navigate('record');
</script>
</body>
</html>
