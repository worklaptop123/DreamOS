<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DreamOS // Hyper-Neural Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #020204; 
            --ui-border: rgba(255, 255, 255, 0.05);
            --neon-violet: #a855f7;
            --neon-cyan: #06b6d4;
            --premium-ease: cubic-bezier(0.16, 1, 0.3, 1); 
            --bounce-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        body { 
            background-color: var(--bg); 
            color: #f4f4f6; 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle Noise Texture Overlay */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 99999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        .heading-font { font-family: 'Space Grotesk', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        
        /* Ultra-Premium Glassmorphism */
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.005) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Floating Sidebar Upgrade */
        .floating-sidebar {
            background: linear-gradient(180deg, rgba(10, 10, 15, 0.4) 0%, rgba(2, 2, 4, 0.6) 100%);
            backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 20px 0 60px -10px rgba(0, 0, 0, 0.8), inset 1px 1px 0 rgba(255,255,255,0.05);
        }

        /* Nav Interface Optimization - Hyper Fluid */
        .nav-item { 
            transition: all 0.5s var(--bounce-ease); 
            color: #71717a; 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: 600; 
            position: relative;
            overflow: hidden;
        }
        
        @media (min-width: 768px) {
            .nav-item {
                justify-content: flex-start;
                padding: 16px 24px; 
                gap: 16px; 
                font-size: 14px;
                border: 1px solid transparent;
            }
            .nav-item::before {
                content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(168,85,247,0.1), transparent); opacity: 0; transition: opacity 0.4s ease;
            }
            .nav-item:hover { 
                color: #e4e4e7; 
                transform: translateX(8px);
                border-color: rgba(255, 255, 255, 0.05);
            }
            .nav-item:hover::before { opacity: 1; }
            .nav-item.active { 
                background: linear-gradient(135deg, rgba(168, 85, 247, 0.15) 0%, rgba(6, 182, 212, 0.05) 100%); 
                color: #d8b4fe; 
                border: 1px solid rgba(168, 85, 247, 0.4);
                box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2), inset 0 1px 0 rgba(255,255,255,0.15);
                transform: scale(1.02) translateX(4px);
            }
            .nav-item.active i { color: #e9d5ff; filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.8)); }
        }

        @media (max-width: 767px) {
            .nav-item { flex-direction: column; gap: 6px; font-size: 10px; flex: 1; padding: 12px 0; border-radius: 20px; }
            .nav-item.active { color: #c084fc; background: rgba(255,255,255,0.04); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
            .nav-item.active i { transform: translateY(-4px) scale(1.1); color: #e9d5ff; filter: drop-shadow(0 0 12px rgba(168, 85, 247, 1)); }
            .nav-item i { transition: all 0.5s var(--bounce-ease); }
        }
        
        #viewport { transition: opacity 0.7s var(--premium-ease), transform 0.7s var(--premium-ease); overflow-y: auto; position: relative; scroll-behavior: smooth; }
        .fade-out { opacity: 0; pointer-events: none; transform: translateY(30px) scale(0.95) rotateX(5deg); filter: blur(10px); }
        .fade-in { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); filter: blur(0); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* Environmental Orbs Upgrade */
        #atmospheric-orb { 
            position: fixed; top: -10%; left: 5%; width: 90vw; height: 90vw; 
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(6, 182, 212, 0.05) 40%, transparent 70%); 
            filter: blur(140px); z-index: -1; pointer-events: none; animation: quantumBreathe 12s ease-in-out infinite alternate; 
        }
        #atmospheric-orb-2 { 
            position: fixed; bottom: -20%; right: -10%; width: 80vw; height: 80vw; 
            background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, rgba(168, 85, 247, 0.04) 50%, transparent 80%); 
            filter: blur(100px); z-index: -1; pointer-events: none; animation: quantumBreathe 18s ease-in-out infinite alternate-reverse;
        }

        .app-grid {
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none; z-index: -1;
            transform: perspective(1000px) rotateX(60deg) scale(2.5) translateY(-20%);
            transform-origin: top center;
            opacity: 0.4;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }
        .app-grid::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 30%, transparent 10%, var(--bg) 70%);
        }

        .animate-slide-up { opacity: 0; transform: translateY(40px) scale(0.98); filter: blur(12px); animation: slideFadeUp 1s var(--bounce-ease) forwards; }
        
        /* Insane Card Hover Physics */
        .hover-card { transition: all 0.6s var(--bounce-ease); position: relative; transform-style: preserve-3d; }
        .hover-card::before {
            content: ''; position: absolute; inset: -2px; border-radius: inherit; z-index: -1;
            background: linear-gradient(135deg, var(--neon-violet), var(--neon-cyan), var(--neon-violet));
            background-size: 200% auto; opacity: 0; transition: opacity 0.5s ease; filter: blur(12px);
        }
        .hover-card::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            border: 1px solid transparent; background: linear-gradient(135deg, rgba(168, 85, 247, 0.6), rgba(6, 182, 212, 0.6)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.5s var(--premium-ease); pointer-events: none;
        }
        .hover-card:hover { 
            transform: translateY(-12px) scale(1.02) rotateX(2deg) rotateY(1deg); 
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8), 0 0 50px rgba(168,85,247,0.15); 
            background: rgba(255,255,255,0.04); 
        }
        .hover-card:hover::before, .hover-card:hover::after { opacity: 1; animation: gradientShift 3s linear infinite; }

        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Organic Orb Architecture Upgrade */
        .orb-stage { position: relative; width: 100%; max-width: 550px; height: 420px; display: flex; justify-content: center; align-items: center; margin: 0 auto; transition: all 1.2s cubic-bezier(0.2, 1, 0.2, 1); perspective: 1000px; }
        
        @keyframes fluidShape {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            33% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            66% { border-radius: 50% 40% 60% 40% / 40% 50% 40% 60%; }
        }

        .orb-core { 
            position: absolute; width: 180px; height: 180px; cursor: pointer; 
            background: radial-gradient(circle at 30% 30%, #fff, #c084fc 20%, #6b21a8 60%, #020204 100%); 
            box-shadow: inset -15px -15px 40px rgba(0,0,0,0.9), inset 15px 15px 40px rgba(255,255,255,0.8), 0 0 80px rgba(168, 85, 247, 0.4); 
            transition: all 0.8s var(--bounce-ease); z-index: 10; 
            animation: fluidShape 8s ease-in-out infinite, quantumFloat 6s ease-in-out infinite;
        }
        
        .tech-ring {
            position: absolute; border-radius: 50%; border: 1px dashed rgba(6, 182, 212, 0.3);
            pointer-events: none; z-index: 2; transition: all 1.5s var(--bounce-ease); transform-style: preserve-3d;
        }
        .tr-1 { width: 260px; height: 260px; animation: orb-spin-3d 20s linear infinite; border-top-color: rgba(168,85,247,0.6); border-width: 2px; }
        .tr-2 { width: 340px; height: 340px; animation: orb-spin-3d 30s linear infinite reverse; border-bottom-color: rgba(6,182,212,0.6); border-style: dotted; border-width: 3px; }
        
        @keyframes orb-spin-3d { from { transform: rotateX(60deg) rotateY(20deg) rotateZ(0deg); } to { transform: rotateX(60deg) rotateY(20deg) rotateZ(360deg); } }

        .orb-glow { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: conic-gradient(from 180deg, transparent, rgba(168, 85, 247, 0.8), transparent, rgba(6, 182, 212, 0.8), transparent); filter: blur(40px); animation: orb-spin 8s linear infinite; pointer-events: none; z-index: 5; transition: all 1.2s var(--premium-ease); opacity: 0.7; }
        
        .ripple { position: absolute; width: 180px; height: 180px; border-radius: 50%; border: 2px solid rgba(168, 85, 247, 0.6); opacity: 0; pointer-events: none; z-index: 4; }
        
        #orb-morph-ring { position: absolute; width: 100%; height: 100%; border: 4px solid #c084fc; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 20; transform: scale(0.4); box-shadow: 0 0 50px #c084fc; }

        /* Active Listening State */
        .is-listening .orb-core { 
            background: radial-gradient(circle at 50% 50%, #ffffff, #22d3ee 30%, #0891b2 70%, #020204 100%); 
            box-shadow: inset -10px -10px 30px rgba(0,0,0,0.8), inset 10px 10px 35px rgba(255,255,255,0.9), 0 0 120px rgba(6, 182, 212, 0.9); 
            animation: fluidShape 3s ease-in-out infinite, pulseGlow 1s infinite alternate;
        }
        @keyframes pulseGlow { from { filter: brightness(1); } to { filter: brightness(1.3); transform: scale(1.05); } }

        .is-listening .orb-glow { width: 380px; height: 380px; filter: blur(50px) brightness(1.8); animation: orb-spin 3s linear infinite; }
        .is-listening .tr-1 { width: 400px; height: 400px; border-color: rgba(6, 182, 212, 0.8); border-width: 4px; transform: rotateX(70deg) rotateY(0) scale(1.2); }
        .is-listening .tr-2 { width: 480px; height: 480px; border-color: rgba(168, 85, 247, 0.7); border-width: 2px; transform: rotateX(50deg) rotateY(30deg) scale(0.8); }
        .is-listening .ripple-1 { animation: ripple-effect 2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
        .is-listening .ripple-2 { animation: ripple-effect 2s cubic-bezier(0.16, 1, 0.3, 1) infinite 1s; }

        /* Morphed State (Result) */
        .orb-stage.is-morphed { height: 560px; max-width: 680px; }
        .is-morphed .orb-core { 
            width: 100%; height: 100%; border-radius: 40px !important; animation: none !important; 
            background: linear-gradient(160deg, rgba(15, 15, 20, 0.8) 0%, rgba(5, 5, 8, 0.95) 100%); 
            box-shadow: 0 60px 120px -20px rgba(0,0,0,1), inset 0 2px 4px rgba(255,255,255,0.2), 0 0 80px rgba(168,85,247,0.1); 
            border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(60px); -webkit-backdrop-filter: blur(60px); 
            cursor: default; transform: scale(1) !important; transition: all 1.2s var(--bounce-ease); 
        }
        .is-morphed .orb-glow { width: 140%; height: 140%; opacity: 0.15; filter: blur(100px); animation: orb-spin 40s linear infinite; }
        .is-morphed .tech-ring { opacity: 0; scale: 2; pointer-events: none; }
        .is-morphed #orb-morph-ring { animation: morph-ring-boom 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .morph-content { position: absolute; inset: 0; z-index: 20; padding: 3rem; display: flex; flex-direction: column; pointer-events: none; }
        .is-morphed .morph-content { pointer-events: all; }
        
        .reveal-item { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
        .is-morphed .reveal-item { animation: slideFadeUp 0.8s var(--bounce-ease) forwards; }
        .is-morphed .delay-1 { animation-delay: 0.4s; } 
        .is-morphed .delay-2 { animation-delay: 0.55s; } 
        .is-morphed .delay-3 { animation-delay: 0.7s; }

        @media (max-width: 768px) {
            .orb-stage.is-morphed { height: 100%; min-height: 500px; }
            .morph-content { padding: 2rem; }
            .orb-core { width: 150px; height: 150px; }
            .ripple { width: 150px; height: 150px; }
            .tech-ring { display: none; }
        }

        .live-word { display: inline-block; animation: word-fade-in 0.5s var(--bounce-ease) forwards; opacity: 0; filter: blur(8px) brightness(2); transform: translateY(10px) scale(1.2); margin-right: 0.25em; color: #fff; text-shadow: 0 0 20px rgba(6, 182, 212, 0.8); font-weight: 500; }

        /* Lock Screen Upgrade - Cybernetic Iris */
        #lock-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, rgba(10,10,15,0.85) 0%, rgba(0,0,0,1) 100%);
            backdrop-filter: blur(80px) saturate(200%);
            -webkit-backdrop-filter: blur(80px) saturate(200%);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding-top: calc(15vh + env(safe-area-inset-top));
            padding-bottom: calc(8vh + env(safe-area-inset-bottom));
            transition: all 0.7s cubic-bezier(0.7, 0, 0.3, 1);
        }
        
        #lock-screen::before {
            content: ''; position: absolute; inset: 0; 
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
            pointer-events: none; z-index: -1;
            animation: scanline 10s linear infinite;
        }
        @keyframes scanline { from { transform: translateY(-100%); } to { transform: translateY(100%); } }

        .lock-hidden { opacity: 0; pointer-events: none; transform: scale(1.15) translateY(-50px); filter: blur(30px); }
        
        @keyframes errorShake {
            0%, 100% { transform: translateX(0) rotate(0); }
            15% { transform: translateX(-15px) rotate(-2deg); filter: blur(2px) hue-rotate(90deg); }
            30% { transform: translateX(15px) rotate(2deg); filter: blur(0); }
            45% { transform: translateX(-10px) rotate(-1deg); }
            60% { transform: translateX(10px) rotate(1deg); }
        }
        .shake { animation: errorShake 0.5s var(--bounce-ease) both; }
        
        /* Sci-Fi Keypad */
        .ios-key {
            width: 84px; height: 84px; border-radius: 50%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; transition: all 0.2s var(--bounce-ease);
            touch-manipulation: manipulation; -webkit-tap-highlight-color: transparent;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 10px 20px -5px rgba(0,0,0,0.5);
        }
        .ios-key:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: inset 0 2px 10px rgba(168, 85, 247, 0.2), 0 0 20px rgba(168, 85, 247, 0.2);
            transform: translateY(-2px);
        }
        .ios-key:active {
            background: rgba(168, 85, 247, 0.3);
            transform: scale(0.9) translateY(4px);
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
            border-color: rgba(168, 85, 247, 0.8);
        }
        .ios-key-label {
            font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-top: -2px; opacity: 0.4; font-family: 'JetBrains Mono', monospace;
        }

        /* Animation Matrices */
        @keyframes quantumFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
        @keyframes orb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes ripple-effect { 0% { width: 180px; height: 180px; opacity: 1; border-width: 4px; border-color: rgba(6, 182, 212, 1); transform: scale(1); } 100% { width: 700px; height: 700px; opacity: 0; border-width: 0px; border-color: rgba(168, 85, 247, 0); transform: scale(1.5); } }
        @keyframes slideFadeUp { 0% { opacity: 0; transform: translateY(40px) scale(0.98); filter: blur(12px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes quantumBreathe { 0% { opacity: 0.2; transform: scale(0.8) translate(5%, -5%); } 100% { opacity: 0.8; transform: scale(1.2) translate(-5%, 5%); } }
        @keyframes word-fade-in { to { opacity: 1; filter: blur(0) brightness(1); transform: translateY(0) scale(1); } }
        @keyframes morph-ring-boom { 0% { opacity: 1; transform: scale(0.5); border-width: 8px; border-color: var(--neon-cyan); box-shadow: 0 0 100px var(--neon-cyan); } 100% { opacity: 0; transform: scale(3.5); border-width: 0px; border-color: var(--neon-violet); box-shadow: 0 0 0px var(--neon-violet); } }
    </style>
</head>
<body class="bg-[#020204]">

    <!-- Advanced Vault UI Lock Layer -->
    <div id="lock-screen" class="select-none flex">
        <div class="flex flex-col items-center text-center animate-slide-up">
            <div class="relative mb-8 group">
                <div class="absolute inset-0 bg-gradient-to-r from-purple-500 to-cyan-500 rounded-full blur-xl opacity-40 group-hover:opacity-70 transition-opacity duration-700 animate-pulse"></div>
                <div class="w-16 h-16 rounded-full border-2 border-white/20 bg-black/50 backdrop-blur-md flex items-center justify-center relative z-10 shadow-[0_0_50px_rgba(255,255,255,0.1)]">
                    <i data-lucide="lock" id="lock-icon" class="w-7 h-7 text-white/95"></i>
                </div>
            </div>
            <h1 id="lock-status" class="text-2xl font-bold tracking-wider text-white heading-font">Enter Passcode</h1>
            <p id="lock-substatus" class="text-[11px] text-cyan-400 font-mono tracking-[0.2em] uppercase mt-2 opacity-80">Awaiting Security Authorization</p>
            
            <div id="passcode-dots" class="flex gap-6 mt-10 transition-transform duration-300">
                <div class="w-4 h-4 rounded-full border-2 border-white/30 transition-all duration-300"></div>
                <div class="w-4 h-4 rounded-full border-2 border-white/30 transition-all duration-300"></div>
                <div class="w-4 h-4 rounded-full border-2 border-white/30 transition-all duration-300"></div>
                <div class="w-4 h-4 rounded-full border-2 border-white/30 transition-all duration-300"></div>
            </div>
        </div>

        <div class="flex flex-col items-center w-full max-w-[320px] animate-slide-up" style="animation-delay: 0.1s">
            <div class="grid grid-cols-3 gap-x-8 gap-y-6 w-full justify-items-center">
                <button onclick="SystemLock.pressKey('1')" class="ios-key"><span class="text-4xl font-light">1</span><span class="ios-key-label">&nbsp;</span></button>
                <button onclick="SystemLock.pressKey('2')" class="ios-key"><span class="text-4xl font-light">2</span><span class="ios-key-label">A B C</span></button>
                <button onclick="SystemLock.pressKey('3')" class="ios-key"><span class="text-4xl font-light">3</span><span class="ios-key-label">D E F</span></button>
                
                <button onclick="SystemLock.pressKey('4')" class="ios-key"><span class="text-4xl font-light">4</span><span class="ios-key-label">G H I</span></button>
                <button onclick="SystemLock.pressKey('5')" class="ios-key"><span class="text-4xl font-light">5</span><span class="ios-key-label">J K L</span></button>
                <button onclick="SystemLock.pressKey('6')" class="ios-key"><span class="text-4xl font-light">6</span><span class="ios-key-label">M N O</span></button>
                
                <button onclick="SystemLock.pressKey('7')" class="ios-key"><span class="text-4xl font-light">7</span><span class="ios-key-label">P Q R S</span></button>
                <button onclick="SystemLock.pressKey('8')" class="ios-key"><span class="text-4xl font-light">8</span><span class="ios-key-label">T U V</span></button>
                <button onclick="SystemLock.pressKey('9')" class="ios-key"><span class="text-4xl font-light">9</span><span class="ios-key-label">W X Y Z</span></button>
                
                <div class="w-[84px] h-[84px]"></div>
                <button onclick="SystemLock.pressKey('0')" class="ios-key"><span class="text-4xl font-light">0</span><span class="ios-key-label">+</span></button>
                <button onclick="SystemLock.pressDelete()" class="w-[84px] h-[84px] flex items-center justify-center text-sm font-bold tracking-widest uppercase text-zinc-400 hover:text-white active:text-purple-400 transition-colors duration-200 touch-manipulation">Delete</button>
            </div>
        </div>
    </div>

    <!-- Application Core Layer (Hidden until Authorized) -->
    <div id="app-core" class="hidden flex-col md:flex-row h-[100dvh] w-screen overflow-hidden">
        <div id="atmospheric-orb"></div>
        <div id="atmospheric-orb-2"></div>
        <div class="app-grid"></div>

        <main id="viewport" class="flex-1 p-6 sm:p-10 md:p-16 w-full h-full overflow-y-auto scrollbar-hide z-20 fade-in max-md:pb-40"></main>

<script>
    /** --- SYSTEM SECURITY PROTOCOL --- */
    const SystemLock = {
        isLocked: true,
        currentInput: '',
        mode: 'ENTER',
        tempPasscode: '',
        
        init() {
            try {
                const savedPasscode = localStorage.getItem('sys_passcode');
                if (!savedPasscode) {
                    this.mode = 'CREATE';
                    this.updateUI('Create Passcode', 'Setup a new 4-digit security key');
                } else {
                    this.mode = 'ENTER';
                    this.updateUI('Enter Passcode', 'Awaiting Authorization');
                }
            } catch (e) { console.error("Storage inaccessible."); }

            document.addEventListener('keydown', (e) => {
                if (!this.isLocked) return;
                if (e.key >= '0' && e.key <= '9') {
                    this.pressKey(e.key);
                } else if (e.key === 'Backspace') {
                    this.pressDelete();
                }
            });

            // Enhanced security auto-lock logic (fires only if entirely blurred out)
            window.addEventListener('blur', () => {
                if (!this.isLocked) this.lock();
            });
            
            lucide.createIcons();
        },
        updateUI(status, substatus) {
            const statusEl = document.getElementById('lock-status');
            const substatusEl = document.getElementById('lock-substatus');
            if (statusEl) statusEl.innerText = status;
            if (substatusEl) substatusEl.innerText = substatus;
            this.updateDots();
        },
        updateDots() {
            const dotsContainer = document.getElementById('passcode-dots');
            if (!dotsContainer) return;
            const dots = dotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                if (i < this.currentInput.length) {
                    dots[i].classList.remove('border-white/30', 'bg-transparent', 'scale-100');
                    dots[i].classList.add('bg-cyan-400', 'border-cyan-400', 'scale-125', 'shadow-[0_0_15px_rgba(34,211,238,0.8)]');
                } else {
                    dots[i].classList.remove('bg-cyan-400', 'border-cyan-400', 'scale-125', 'shadow-[0_0_15px_rgba(34,211,238,0.8)]');
                    dots[i].classList.add('border-white/30', 'bg-transparent', 'scale-100');
                }
            }
        },
        pressKey(num) {
            if (this.currentInput.length >= 4) return;
            this.currentInput += num;
            this.updateDots();

            if (this.currentInput.length === 4) {
                setTimeout(() => this.processPasscode(), 300);
            }
        },
        pressDelete() {
            if (this.currentInput.length > 0) {
                this.currentInput = this.currentInput.slice(0, -1);
                this.updateDots();
            }
        },
        processPasscode() {
            if (this.mode === 'CREATE') {
                this.tempPasscode = this.currentInput;
                this.currentInput = '';
                this.mode = 'CONFIRM';
                this.updateUI('Confirm Passcode', 'Re-enter your 4-digit key');
            } else if (this.mode === 'CONFIRM') {
                if (this.currentInput === this.tempPasscode) {
                    try { localStorage.setItem('sys_passcode', this.currentInput); } catch (e) {}
                    this.currentInput = '';
                    this.mode = 'ENTER';
                    this.unlock();
                } else {
                    this.triggerError('Match Failed', 'Please try again');
                }
            } else if (this.mode === 'ENTER') {
                const savedPasscode = localStorage.getItem('sys_passcode');
                if (this.currentInput === savedPasscode) {
                    this.unlock();
                } else {
                    this.triggerError('Wrong Passcode', 'Authentication Failed');
                }
            }
        },
        triggerError(status, substatus) {
            this.currentInput = '';
            this.updateUI(status, substatus);
            
            const dotsContainer = document.getElementById('passcode-dots');
            if (dotsContainer) {
                dotsContainer.classList.add('shake');
                setTimeout(() => {
                    dotsContainer.classList.remove('shake');
                    const savedPasscode = localStorage.getItem('sys_passcode');
                    if (!savedPasscode) {
                        this.mode = 'CREATE';
                        this.updateUI('Create Passcode', 'Setup a new 4-digit security key');
                    } else {
                        this.mode = 'ENTER';
                        this.updateUI('Enter Passcode', 'Awaiting Authorization');
                    }
                }, 600);
            }
        },
        unlock() {
            this.isLocked = false;
            this.currentInput = '';
            const screen = document.getElementById('lock-screen');
            const appCore = document.getElementById('app-core');
            
            screen.classList.add('lock-hidden');
            appCore.classList.remove('hidden');
            appCore.classList.add('flex');
            
            setTimeout(() => { screen.style.display = 'none'; }, 700);
        },
        lock() {
            this.isLocked = true;
            this.currentInput = '';
            const screen = document.getElementById('lock-screen');
            const appCore = document.getElementById('app-core');
            
            screen.style.display = 'flex';
            appCore.classList.add('hidden');
            appCore.classList.remove('flex');
            
            requestAnimationFrame(() => {
                screen.classList.remove('lock-hidden');
                const savedPasscode = localStorage.getItem('sys_passcode');
                if (!savedPasscode) {
                    this.mode = 'CREATE';
                    this.updateUI('Create Passcode', 'Setup a new 4-digit security key');
                } else {
                    this.mode = 'ENTER';
                    this.updateUI('Enter Passcode', 'Awaiting Authorization');
                }
            });
        }
    };

    /** --- NEURAL LANGUAGE PROCESSING (NLP) ENGINE --- */
    const NLPEngine = {
        // Implicit emotion triggers map directly to core emotions
        emotionTriggers: {
            'crying': 'sad', 'tears': 'sad', 'heartbreak': 'sad', 'loss': 'sad', 'mourning': 'sad', 'grief': 'sad',
            'smiling': 'happy', 'laughing': 'happy', 'sunshine': 'joyful', 'flying': 'euphoric', 'dancing': 'joyful',
            'yelling': 'angry', 'screaming': 'panicked', 'shaking': 'scared', 'hiding': 'fear', 'running': 'panicked',
            'sweating': 'anxious', 'stuck': 'frustrated', 'trapped': 'terrified', 'frozen': 'terrified',
            'peace': 'calm', 'floating': 'calm', 'relax': 'peaceful', 'quiet': 'calm',
            'dark': 'scared', 'monster': 'terrified', 'scream': 'panicked', 'falling': 'terrified'
        },
        // Explicit emotion definitions
        explicitEmotions: ['happy', 'sad', 'angry', 'scared', 'anxious', 'calm', 'confused', 'excited', 'terrified', 'joyful', 'frustrated', 'peaceful', 'panicked', 'dread', 'euphoric', 'melancholy', 'nostalgic', 'tense', 'overwhelmed', 'loved', 'hated', 'fear', 'rage', 'bliss'],
        
        // Extended stop words for cleaning up entity extraction
        stopWords: new Set(['the', 'and', 'is', 'in', 'it', 'to', 'of', 'for', 'with', 'on', 'at', 'from', 'by', 'about', 'as', 'into', 'like', 'through', 'after', 'over', 'between', 'out', 'against', 'during', 'without', 'before', 'under', 'around', 'among', 'that', 'this', 'these', 'those', 'i', 'you', 'he', 'she', 'we', 'they', 'my', 'your', 'his', 'her', 'our', 'their', 'a', 'an', 'was', 'were', 'be', 'been', 'am', 'are', 'had', 'have', 'has', 'do', 'does', 'did', 'but', 'or', 'so', 'because', 'just', 'very', 'not', 'no', 'yes', 'can', 'could', 'would', 'should', 'will', 'all', 'some', 'any', 'many', 'much', 'more', 'most', 'other', 'such', 'only', 'same', 'than', 'too', 'also', 'went', 'came', 'said', 'told', 'saw', 'looked', 'felt']),

        extract(text) {
            if (!text) return { type: 'Normal', people: [], entities: [], emotions: [] };
            
            const words = text.match(/\b[a-zA-Z]+\b/g) || [];
            let extEmotions = new Set();
            let extNames = new Set();
            let extEntities = new Set();

            // Extract Proper Nouns (Names) based on Capitalization not at sentence start
            const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
            sentences.forEach(sentence => {
                const sentenceTokens = sentence.trim().split(/\s+/);
                for (let i = 1; i < sentenceTokens.length; i++) {
                    let word = sentenceTokens[i].replace(/[^a-zA-Z]/g, '');
                    if (word.length > 2 && word[0] === word[0].toUpperCase() && word.slice(1) === word.slice(1).toLowerCase()) {
                        extNames.add(word);
                    }
                }
            });

            // Flatten emotion triggers and explicits into one dictionary
            const emotionMap = { ...this.emotionTriggers };
            this.explicitEmotions.forEach(e => emotionMap[e] = e);

            // Intelligent Contextual Extraction
            words.forEach(wRaw => {
                const w = wRaw.toLowerCase();
                
                // Track Emotions (Direct match or implicit trigger)
                if (emotionMap[w]) {
                    extEmotions.add(emotionMap[w]);
                }
                
                // Track Entities (Words > 3 length, not stop words, not emotions, not names)
                if (wRaw.length > 3 && !this.stopWords.has(w) && !emotionMap[w]) {
                    let isName = false;
                    extNames.forEach(name => {
                        if (name.toLowerCase() === w) isName = true;
                    });
                    
                    if (!isName) {
                        extEntities.add(wRaw);
                    }
                }
            });

            // Type classification via weighted keyword analysis
            let type = 'Normal';
            const lucidTriggers = ['lucid', 'control', 'aware', 'realize', 'awake', 'knew', 'conscious', 'flew'];
            const nightmareTriggers = ['nightmare', 'scared', 'terrified', 'monster', 'run', 'chased', 'died', 'kill', 'dark', 'demon', 'ghost', 'trapped', 'scream', 'blood', 'fall'];
            
            let lucidScore = lucidTriggers.filter(t => words.map(w => w.toLowerCase()).includes(t)).length;
            let nightmareScore = nightmareTriggers.filter(t => words.map(w => w.toLowerCase()).includes(t)).length;
            
            if (lucidScore > 0 && lucidScore >= nightmareScore) type = 'Lucid';
            else if (nightmareScore > 0) type = 'Nightmare';

            return {
                type,
                people: [...extNames],
                entities: [...extEntities].map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()),
                emotions: [...extEmotions].map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
            };
        }
    };

    /** --- SYSTEM REGISTRY DATA PLATFORM --- */
    const Store = {
        get() { try { const r = localStorage.getItem('dreams_v3'); return r ? JSON.parse(r).map(d => this.normalize(d)) : []; } catch (e) { return []; } },
        save(d) { const ds = this.get(); ds.unshift(this.normalize(d)); try { localStorage.setItem('dreams_v3', JSON.stringify(ds)); } catch(e) {} },
        delete(id) { const ds = this.get().filter(d => d.id !== id); try { localStorage.setItem('dreams_v3', JSON.stringify(ds)); } catch(e) {} },
        getById(id) { return this.get().find(d => d.id == id); },
        normalize(d) {
            if (!d) d = {};
            return {
                id: d.id || Date.now(), 
                createdAt: d.createdAt || new Date().toISOString(), 
                title: d.title || 'Untitled Stream Sequence', 
                transcript: d.transcript || '', 
                analysis: { 
                    type: d.analysis?.type || 'Normal', 
                    emotions: Array.isArray(d.analysis?.emotions) ? d.analysis.emotions : [], 
                    people: Array.isArray(d.analysis?.people) ? d.analysis.people : [], 
                    entities: Array.isArray(d.analysis?.entities) ? d.analysis.entities : [] 
                }, 
                metadata: { deleted: !!d.metadata?.deleted }
            };
        }
    };

    /** --- ANALYTICS FRAMEWORK PROCESSING --- */
    const PatternAnalyzer = {
        extract(dreams) {
            const p = { entities: {}, people: {}, emotions: {}, types: { Normal: 0, Lucid: 0, Nightmare: 0 } };
            dreams.forEach(d => {
                if (!d.analysis) return;
                const type = d.analysis.type;
                if(p.types[type] !== undefined) p.types[type]++; else p.types['Normal']++;
                ['emotions', 'entities', 'people'].forEach(cat => {
                    if (Array.isArray(d.analysis[cat])) {
                        d.analysis[cat].forEach(item => { 
                            if(item) { const norm = item.charAt(0).toUpperCase() + item.slice(1).toLowerCase(); p[cat][norm] = (p[cat][norm] || 0) + 1; }
                        });
                    }
                });
            });
            const sortMap = (map) => Object.entries(map).sort((a,b) => b[1] - a[1]).map(([name, count]) => ({name, count}));
            return { types: p.types, emotions: sortMap(p.emotions), entities: sortMap(p.entities), people: sortMap(p.people) };
        }
    };

    const AnalyticsEngine = {
        compute(searchQuery = '') {
            let db = Store.get().filter(d => !d.metadata?.deleted);
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                db = db.filter(d => (d.title && d.title.toLowerCase().includes(q)) || (d.transcript && d.transcript.toLowerCase().includes(q)));
            }
            return { data: { totalDreams: db.length, types: PatternAnalyzer.extract(db).types, patterns: PatternAnalyzer.extract(db) } };
        }
    };

    const AnalyticsModule = {
        searchQuery: '',
        render() {
            const v = document.getElementById('viewport'); if(!v) return;
            const { data } = AnalyticsEngine.compute(this.searchQuery);
            
            v.innerHTML = `
                <div class="max-w-7xl mx-auto pb-16">
                    <div class="animate-slide-up" style="animation-delay: 0s">
                        <div class="flex flex-col xl:flex-row justify-between items-start xl:items-end mb-12 md:mb-16 border-b border-white/10 pb-8 gap-8 relative">
                            <div class="absolute -bottom-px left-0 w-1/3 h-px bg-gradient-to-r from-purple-500 to-transparent"></div>
                            <div>
                                <div class="text-[11px] font-mono uppercase tracking-[0.2em] text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3 py-1.5 rounded-lg w-fit mb-4 shadow-[0_0_15px_rgba(6,182,212,0.15)] flex items-center gap-2">
                                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                                    System Telemetry Matrix
                                </div>
                                <h1 class="text-4xl md:text-5xl lg:text-6xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-white via-zinc-200 to-zinc-500 mb-3 heading-font leading-tight">Neural Analytics</h1>
                                <p class="text-sm md:text-base text-zinc-400 tracking-wide max-w-2xl font-light">Deep structural data compilation analyzing underlying variables, emotional frequencies, and locational spatial matrices.</p>
                            </div>
                            <div class="relative group w-full xl:w-auto shrink-0">
                                <i data-lucide="fingerprint" class="w-5 h-5 text-zinc-500 absolute left-5 top-1/2 -translate-y-1/2 group-focus-within:text-purple-400 transition-colors"></i>
                                <input type="text" id="analytics-search" placeholder="Query tracking array parameters..." value="${this.searchQuery}" 
                                    class="glass-card pl-14 pr-6 py-4 text-sm font-mono rounded-2xl outline-none focus:border-purple-500/60 focus:ring-4 focus:ring-purple-500/20 border border-white/10 w-full xl:w-96 transition-all duration-500 placeholder-zinc-500 text-zinc-100 shadow-xl">
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6 md:gap-8 mb-16 perspective-1000">
                        ${this.statCard("TOTAL CORE SECTORS", data.totalDreams, 0.1, "box", "text-purple-400", "bg-purple-500/10", "shadow-purple-500/10")}
                        ${this.statCard("STANDARD STREAM MATRICES", data.types.Normal || 0, 0.2, "activity", "text-zinc-300", "bg-white/10", "shadow-white/5")}
                        ${this.statCard("LUCID COGNITIVE ANCHORS", data.types.Lucid || 0, 0.3, "zap", "text-cyan-400", "bg-cyan-500/10", "shadow-cyan-500/10")}
                        ${this.statCard("STRESS ANOMALY RECURRENCES", data.types.Nightmare || 0, 0.4, "alert-triangle", "text-rose-500", "bg-rose-500/10", "shadow-rose-500/10")}
                    </div>
                    
                    <div class="animate-slide-up mb-6" style="animation-delay: 0.5s">
                        <div class="flex items-center gap-4 mb-8">
                            <div class="w-2 h-6 bg-gradient-to-b from-purple-500 to-cyan-500 rounded-full shadow-[0_0_15px_rgba(168,85,247,0.5)]"></div>
                            <h2 class="text-sm uppercase font-bold tracking-[0.2em] text-zinc-300 font-mono">Extracted Core Variables</h2>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            ${this.rankCard("Identified Entities / People", data.patterns.people, "users", "border-purple-500/20", "bg-purple-500/10", "text-purple-400", "shadow-[0_10px_30px_rgba(168,85,247,0.05)]")}
                            ${this.rankCard("Extracted Entities", data.patterns.entities, "box", "border-cyan-500/20", "bg-cyan-500/10", "text-cyan-400", "shadow-[0_10px_30px_rgba(6,182,212,0.05)]")}
                            ${this.rankCard("Limbic Affection / Emotions", data.patterns.emotions, "heart", "border-rose-500/20", "bg-rose-500/10", "text-rose-400", "shadow-[0_10px_30px_rgba(244,63,94,0.05)]")}
                        </div>
                    </div>
                </div>
            `;
            const searchInput = document.getElementById('analytics-search');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    this.searchQuery = e.target.value;
                    this.render();
                    const nextEl = document.getElementById('analytics-search');
                    if (nextEl) { nextEl.focus(); nextEl.setSelectionRange(nextEl.value.length, nextEl.value.length); }
                });
            }
            lucide.createIcons();
        },
        statCard(label, val, delay, icon, iconColor, iconBg, shadow) { 
            return `<div class="glass-card p-8 rounded-[2rem] border border-white/5 animate-slide-up hover-card relative overflow-hidden flex flex-col justify-between ${shadow}" style="animation-delay: ${delay}s; min-height: 160px;">
                        <div class="absolute -right-10 -top-10 w-40 h-40 ${iconBg} rounded-full blur-3xl opacity-50 pointer-events-none"></div>
                        <div class="flex justify-between items-start w-full relative z-10">

                            <div class="p-2.5 ${iconBg} border border-white/10 rounded-2xl shadow-inner backdrop-blur-md">
                                <i data-lucide="${icon}" class="w-5 h-5 ${iconColor}"></i>
                            </div>
                        </div>
                        <div class="text-5xl md:text-6xl font-black text-white tracking-tighter heading-font mt-6 flex items-baseline gap-2 relative z-10 drop-shadow-lg">${val}<span class="text-sm font-mono font-normal text-zinc-500 tracking-widest">sys</span></div>
                    </div>`; 
        },
        rankCard(title, arr, icon, border, bg, txt, shadow) {
            return `
                <div class="glass-card p-8 rounded-[2rem] border border-white/5 relative overflow-hidden group hover:border-white/20 transition-all duration-700 ${shadow} transform-gpu hover:-translate-y-2">
                    <div class="absolute inset-0 bg-gradient-to-b from-white/[0.02] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>
                    <div class="flex items-center justify-between mb-8 border-b border-white/10 pb-5">

                    <div class="space-y-3 relative z-10">
                        ${arr.length ? arr.slice(0,6).map((i, idx) => `
                            <div class="flex justify-between items-center text-sm py-3 px-4 rounded-2xl hover:bg-white/[0.04] border border-transparent hover:border-white/10 transition-all duration-300 group/row cursor-default">
                                <span class="flex items-center gap-4">
                                    <span class="font-mono text-[10px] text-zinc-500 bg-black/50 border border-white/10 w-7 h-7 rounded-lg flex items-center justify-center group-hover/row:text-white transition-colors group-hover/row:border-white/30 shadow-inner">0${idx+1}</span> 
                                    <span class="text-zinc-300 font-medium tracking-wide group-hover/row:text-white transition-colors">${i.name}</span>
                                </span> 
                                <span class="font-mono text-[10px] ${txt} font-bold ${bg} px-3 py-1 rounded-lg border ${border} shadow-sm">${i.count} cycles</span>
                            </div>
                        `).join('') : '<div class="text-sm text-zinc-500 py-12 italic text-center font-mono bg-black/20 rounded-2xl border border-dashed border-white/10">Awaiting telemetry extraction...</div>'}
                    </div>
                </div>`;
        }
    };

    const ArchiveModule = {
        render() {
            const v = document.getElementById('viewport');
            const data = Store.get().filter(d => !d.metadata?.deleted);
            
            const categories = [
                { name: 'Lucid Memory Fields', type: 'Lucid', color: 'bg-cyan-400', text: 'text-cyan-400', border: 'border-cyan-500/30', bg: 'bg-cyan-950/40', shadow: 'shadow-[0_15px_40px_rgba(6,182,212,0.15)]', glow: 'from-cyan-500/20' },

                                ${this.tagGroup('Limbic State / Emotions', d.analysis.emotions, 'heart', 'text-rose-300', 'bg-rose-500/20', 'border-rose-500/30', 'shadow-[0_0_15px_rgba(244,63,94,0.15)]')}

        },
        tagGroup(title, items, icon, txt, bg, border, shadow) {
            if(!items || items.length === 0) return `
                <div class="glass-card p-5 rounded-2xl border-dashed opacity-60">
                    <h4 class="text-[10px] uppercase font-mono tracking-[0.1em] text-zinc-500 mb-3 flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4"></i> ${title}</h4>

            return `<div class="glass-card p-5 rounded-2xl hover:border-white/20 transition-colors duration-500">
                <h4 class="text-[10px] uppercase font-mono tracking-[0.1em] text-zinc-400 mb-4 flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4 text-zinc-400"></i> ${title}</h4>

        }
    };

    /** --- RECORD PAGE CORE --- */
    const OrbEngine = {
        isRecording: false,
        recognition: null,
        finalTranscript: '',
        displayedWords: [],
        audioCtx: null,
        analyser: null,
        audioStream: null,
        audioAnimFrame: null,
        activeMode: 'orb',
        timeoutRef: null,
        
        init(el) {
            el.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center w-full max-w-3xl mx-auto pb-10">
                    <div id="orb-instructions" class="text-center space-y-6 mb-10 w-full transition-all duration-700 ease-in-out animate-slide-up" style="animation-delay: 0s">
                        <h1 class="text-4xl md:text-6xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-white via-zinc-200 to-zinc-500 heading-font drop-shadow-lg">Have your said</h1>
                        
                        <div class="flex items-center justify-center gap-4 mt-4">
                            <button onclick="OrbEngine.setMode('orb')" id="btn-mode-orb" class="px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-purple-500/20 text-purple-300 border border-purple-500/40 shadow-[0_0_20px_rgba(168,85,247,0.2)] hover:bg-purple-500/30">Neural Orb Link</button>
                            <button onclick="OrbEngine.setMode('text')" id="btn-mode-text" class="px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-black/40 text-zinc-400 border border-white/10 hover:text-white hover:border-white/20 glass-card">Manual Write</button>
                        </div>

                        <div class="glass-card px-8 py-6 mt-6 rounded-[2rem] border border-white/10 w-full relative overflow-hidden text-zinc-300 text-left shadow-2xl hover:border-white/20 transition-all duration-500 group">
                            <div class="absolute -right-20 -bottom-20 w-48 h-48 bg-cyan-500/10 rounded-full blur-[60px] pointer-events-none group-hover:bg-cyan-500/20 transition-colors duration-700"></div>
                            <p class="text-sm md:text-base tracking-wide leading-relaxed flex flex-col gap-3 relative z-10">
                                <span class="flex items-center gap-2 text-[10px] text-cyan-400 font-mono font-bold uppercase tracking-[0.2em] drop-shadow-sm"><i data-lucide="cpu" class="w-4 h-4"></i> System Link Status</span>
                                <span class="font-light opacity-90">The neural engine processes raw vocal input. Just tap the orb and begin transmitting data. NLP matrices will isolate key anomalies automatically.</span>
                            </p>
                        </div>
                    </div>

                    <div id="orb-stage" class="orb-stage animate-slide-up" style="animation-delay: 0.2s">
                        <div class="ripple ripple-1"></div>
                        <div class="ripple ripple-2"></div>
                        <div class="tech-ring tr-1"></div>
                        <div class="tech-ring tr-2"></div>
                        <div class="orb-glow"></div>
                        
                        <div id="orb-morph-ring"></div>
                        
                        <div id="orb-core" class="orb-core flex items-center justify-center group" onclick="OrbEngine.toggle()">
                            <span id="orb-hint" class="text-[11px] font-mono font-bold text-white/90 group-hover:text-cyan-300 uppercase tracking-[0.2em] transition duration-500 pointer-events-none drop-shadow-[0_0_8px_rgba(255,255,255,0.8)] z-20">CONNECT</span>
                        </div>
                        
                        <div class="morph-content">
                            <div class="reveal-item delay-1 flex justify-between items-center mb-6 border-b border-white/10 pb-5">
                                <div>
                                    <h2 class="text-2xl md:text-3xl font-black text-white heading-font tracking-tight drop-shadow-md">Telemetry Synced</h2>
                                    <p class="text-[10px] font-mono text-cyan-400 uppercase tracking-[0.2em] mt-1.5 opacity-80">Cognitive Database Matrix Map Stable</p>
                                </div>
                                <div class="w-12 h-12 rounded-[1rem] bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 shadow-[0_0_20px_rgba(6,182,212,0.2)] backdrop-blur-md">
                                    <i data-lucide="check-square" class="w-6 h-6"></i>
                                </div>
                            </div>
                            
                            <div class="reveal-item delay-2 flex-1 glass-card rounded-[2rem] p-6 md:p-8 overflow-y-auto mb-6 border-white/10 bg-black/40 shadow-inner">
                                <p id="morph-transcript" class="text-zinc-200 text-sm md:text-base leading-loose font-light tracking-wide"></p>
                            </div>
                            
                            <button onclick="OrbEngine.saveAndRoute()" class="reveal-item delay-3 w-full py-5 rounded-[1.5rem] bg-gradient-to-r from-purple-600 to-cyan-600 text-white font-bold tracking-[0.1em] hover:brightness-125 transition-all duration-300 shadow-[0_10px_40px_rgba(168,85,247,0.4)] hover:shadow-[0_15px_50px_rgba(6,182,212,0.5)] flex items-center justify-center gap-3 text-sm uppercase font-mono transform hover:-translate-y-1">
                                <i data-lucide="shield-alert" class="w-5 h-5"></i> Commit Telemetry Array
                            </button>
                        </div>
                    </div>

                    <div id="live-feedback" class="mt-8 text-center text-xl md:text-2xl font-light text-zinc-300 max-w-2xl w-full h-32 overflow-y-auto scrollbar-hide transition-all duration-700 opacity-0 px-8 translate-y-6 leading-relaxed"></div>
                    
                    <div id="text-stage" class="hidden w-full max-w-3xl mx-auto animate-slide-up flex-col gap-6 mt-6" style="animation-delay: 0.2s">
                        <div class="relative group">
                            <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-[2.5rem] blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                            <textarea id="manual-transcript" class="glass-card w-full h-64 bg-black/60 text-zinc-100 rounded-[2rem] p-8 text-base md:text-lg leading-loose tracking-wide resize-none outline-none focus:border-cyan-500/50 focus:ring-4 focus:ring-cyan-500/20 transition-all duration-300 placeholder-zinc-600 font-light relative z-10 shadow-inner" placeholder="Initiate manual entry sequence... Document the entities, emotions, and occurrences..."></textarea>
                        </div>
                        <button onclick="OrbEngine.saveTextAndRoute()" class="w-full py-5 rounded-[1.5rem] bg-gradient-to-r from-cyan-600 to-purple-600 text-white font-bold tracking-[0.1em] hover:brightness-125 transition-all duration-300 shadow-[0_10px_40px_rgba(6,182,212,0.4)] hover:shadow-[0_15px_50px_rgba(168,85,247,0.5)] flex items-center justify-center gap-3 text-sm uppercase font-mono transform hover:-translate-y-1">
                            <i data-lucide="keyboard" class="w-5 h-5"></i> Commit Manual Telemetry
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
            this.resetState();
            
            const SpeechTarget = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechTarget) {
                document.getElementById('orb-hint').innerText = "VCN_ERR";
            } else {
                this.recognition = new SpeechTarget();
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                
                this.recognition.onresult = (e) => {
                    this.finalTranscript = Array.from(e.results).map(r => r[0].transcript).join('');
                    this.renderLiveText();
                    
                    const mt = document.getElementById('morph-transcript');
                    if(mt) mt.innerText = this.finalTranscript;

                    // Reset auto-stop timeout
                    clearTimeout(this.timeoutRef);
                    this.timeoutRef = setTimeout(() => { if (this.isRecording) this.stop(); }, 8000);
                };

                // Continuous listening safeguard
                this.recognition.onend = () => {
                    if(this.isRecording) { try { this.recognition.start(); } catch(e){} }
                };
            }
        },

        resetState() {
            this.isRecording = false;
            this.finalTranscript = '';
            this.displayedWords = [];
            this.activeMode = 'orb';
            if (this.audioAnimFrame) cancelAnimationFrame(this.audioAnimFrame);
            clearTimeout(this.timeoutRef);
        },

        setMode(mode) {
            this.activeMode = mode;
            const btnOrb = document.getElementById('btn-mode-orb');
            const btnText = document.getElementById('btn-mode-text');
            const stageOrb = document.getElementById('orb-stage');
            const stageText = document.getElementById('text-stage');
            const liveFeedback = document.getElementById('live-feedback');

            if (mode === 'orb') {
                btnOrb.className = "px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-purple-500/20 text-purple-300 border border-purple-500/40 shadow-[0_0_20px_rgba(168,85,247,0.2)] hover:bg-purple-500/30";
                btnText.className = "px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-black/40 text-zinc-400 border border-white/10 hover:text-white hover:border-white/20 glass-card";
                
                stageOrb.classList.remove('hidden');
                stageOrb.classList.add('flex');
                stageText.classList.add('hidden');
                stageText.classList.remove('flex');
                liveFeedback.style.display = 'block';
            } else {
                btnText.className = "px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 shadow-[0_0_20px_rgba(6,182,212,0.2)] hover:bg-cyan-500/30";
                btnOrb.className = "px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-black/40 text-zinc-400 border border-white/10 hover:text-white hover:border-white/20 glass-card";
                
                stageOrb.classList.add('hidden');
                stageOrb.classList.remove('flex');
                stageText.classList.remove('hidden');
                stageText.classList.add('flex');
                liveFeedback.style.display = 'none';
                
                if (this.isRecording) this.stop();
            }
        },

        renderLiveText() {
            const fb = document.getElementById('live-feedback');
            if(!fb || !this.finalTranscript) return;
            
            const currentWords = this.finalTranscript.trim().split(/\s+/);
            
            if (currentWords.length > this.displayedWords.length) {
                const newWords = currentWords.slice(this.displayedWords.length);
                newWords.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'live-word';
                    span.innerText = w;
                    fb.appendChild(span);
                    fb.appendChild(document.createTextNode(' '));
                });
                this.displayedWords = currentWords;
                fb.scrollTop = fb.scrollHeight;
            } else if (currentWords.length < this.displayedWords.length || (currentWords.length > 0 && currentWords[0] !== this.displayedWords[0])) {
                fb.innerHTML = currentWords.map(w => `<span class="live-word" style="animation:none; opacity:1; filter:blur(0); transform:none;">${w}</span> `).join('');
                this.displayedWords = currentWords;
            } else if (currentWords.length === this.displayedWords.length) {
                const lastSpan = fb.querySelector('.live-word:last-of-type');
                if(lastSpan) lastSpan.innerText = currentWords[currentWords.length - 1];
            }
        },

        async startAudioReactive() {
            try {
                if(!navigator.mediaDevices) return;
                this.audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioCtx.createAnalyser();
                this.analyser.fftSize = 256;
                const source = this.audioCtx.createMediaStreamSource(this.audioStream);
                source.connect(this.analyser);
                this.audioData = new Uint8Array(this.analyser.frequencyBinCount);
                this.tickAudio();
            } catch(err) {
                console.warn("Telemetry wave bypassed (No Mic Permissions)");
            }
        },

        tickAudio() {
            if(!this.isRecording) return;
            if(this.analyser && this.audioData) {
                this.analyser.getByteFrequencyData(this.audioData);
                let sum = 0; for(let i = 0; i < this.audioData.length; i++) sum += this.audioData[i];
                let avg = sum / this.audioData.length;
                
                const stage = document.getElementById('orb-stage');
                const orb = document.getElementById('orb-core');
                
                if (orb && stage && !stage.classList.contains('is-morphed')) {
                    const volumeScale = 1.05 + (avg / 256) * 0.4; 
                    orb.style.transform = `scale(${volumeScale})`;
                    orb.style.boxShadow = `inset -15px -15px 40px rgba(0,0,0,0.9), inset 15px 15px 45px rgba(255,255,255,0.9), 0 0 ${80 + (avg * 2)}px rgba(6, 182, 212, ${0.5 + (avg/150)})`;
                }
            }
            this.audioAnimFrame = requestAnimationFrame(() => this.tickAudio());
        },

        toggle() {
            if(document.getElementById('orb-stage').classList.contains('is-morphed')) return;
            if(!this.isRecording) this.start(); else this.stop();
        },

        start() {
            if(!this.recognition) return;
            this.isRecording = true;
            this.finalTranscript = '';
            this.displayedWords = [];
            
            try {
                this.recognition.start();
                this.startAudioReactive();
            } catch(e) {}
            
            const stage = document.getElementById('orb-stage');
            stage.classList.add('is-listening');
            
            document.getElementById('orb-hint').innerText = "LISTENING";
            document.getElementById('live-feedback').style.opacity = '1';
            document.getElementById('live-feedback').style.transform = 'translateY(0)';
            document.getElementById('live-feedback').innerHTML = '<span class="text-cyan-500/60 text-sm font-mono tracking-[0.2em] animate-pulse">TRANSMISSION STREAM OPEN...</span>';

            this.timeoutRef = setTimeout(() => {
                if(this.isRecording) this.stop();
            }, 15000);
        },

        stop() {
            this.isRecording = false;
            if(this.audioAnimFrame) cancelAnimationFrame(this.audioAnimFrame);
            clearTimeout(this.timeoutRef);
            
            try {
                this.recognition.stop();
                if(this.audioStream) this.audioStream.getTracks().forEach(t => t.stop());
                if(this.audioCtx) this.audioCtx.close();
            } catch(e) {}
            
            const stage = document.getElementById('orb-stage');
            const orbCore = document.getElementById('orb-core');
            
            if (orbCore) {
                orbCore.style.transform = 'none';
                orbCore.style.boxShadow = '';
            }
            
            stage.classList.remove('is-listening');
            stage.classList.add('is-morphed'); 

            setTimeout(() => { 
                const inst = document.getElementById('orb-instructions');
                if (inst) {
                    inst.style.opacity = '0';
                    inst.style.transform = 'translateY(-20px)';
                    setTimeout(() => inst.style.display = 'none', 700);
                }
            }, 400);
            
            const fb = document.getElementById('live-feedback');
            if (fb) {
                fb.style.opacity = '0';
                fb.style.transform = 'translateY(20px)';
            }
            
            setTimeout(() => {
                const mt = document.getElementById('morph-transcript');
                if (mt) mt.innerText = this.finalTranscript.trim() || "No telemetry stream captured. Neural transmission dropped.";
            }, 100);
        },

        saveTextAndRoute() {
            const manualText = document.getElementById('manual-transcript').value;
            this.processAndSave(manualText);
        },

        saveAndRoute() {
            this.processAndSave(this.finalTranscript);
        },

        processAndSave(rawData) {
            if (rawData.trim()) {
                const analysisResult = NLPEngine.extract(rawData);
                Store.save({
                    title: rawData.slice(0, 40) + (rawData.length > 40 ? '...' : ''), 
                    transcript: rawData, 
                    analysis: analysisResult
                });
            }
            Router.navigate('archive');
        }
    };

    /** --- SYSTEM VIEWPORT NAVIGATION ROUTER --- */
    const Router = {
        async navigate(pageId) {
            const v = document.getElementById('viewport'); if(!v) return;
            
            v.classList.remove('fade-in');
            v.classList.add('fade-out');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === pageId));
            
            await new Promise(r => setTimeout(r, 600));
            
            if (pageId === 'record') OrbEngine.init(v);
            else if (pageId === 'archive') ArchiveModule.render();
            else if (pageId === 'analytics') AnalyticsModule.render();
            
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    v.classList.remove('fade-out'); 
                    v.classList.add('fade-in');
                });
            });
        }
    };

    // Global Interactive Listeners
    document.getElementById('nav-menu').addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link && link.dataset.page) { 
            e.preventDefault(); 
            Router.navigate(link.dataset.page); 
        }
    });

    // Fire Interface Sequence
    Router.navigate('record');
    SystemLock.init();
</script>
</body>
