<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DreamOS // Hyper-Neural Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght=0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:ital,wght=0,100..800;1,100..800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #020204; 
            --ui-border: rgba(255, 255, 255, 0.03);
            --neon-violet: #a855f7;
            --neon-cyan: #06b6d4;
            --premium-ease: cubic-bezier(0.2, 1, 0.2, 1); 
        }
        
        body { 
            background-color: var(--bg); 
            color: #f4f4f6; 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .heading-font { font-family: 'Space Grotesk', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        
        .glass { 
            background: rgba(4, 4, 6, 0.4); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px); 
            border: 1px solid var(--ui-border); 
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.05); 
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.015) 0%, rgba(255, 255, 255, 0.002) 100%);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Nav Interface Optimization */
        .nav-item { 
            transition: all 0.5s var(--premium-ease); 
            color: #71717a; 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: 600; 
            position: relative;
        }
        
        @media (min-width: 768px) {
            .nav-item {
                justify-content: flex-start;
                padding: 14px 20px; 
                gap: 16px; 
                font-size: 14px;
                border: 1px solid transparent;
            }
            .nav-item:hover { 
                background: rgba(255, 255, 255, 0.02); 
                color: #e4e4e7; 
                transform: translateX(6px);
                border-color: rgba(255, 255, 255, 0.03);
            }
            .nav-item.active { 
                background: linear-gradient(90deg, rgba(168, 85, 247, 0.12) 0%, rgba(6, 182, 212, 0.02) 100%); 
                color: #d8b4fe; 
                border: 1px solid rgba(168, 85, 247, 0.3);
                box-shadow: 0 0 30px rgba(168, 85, 247, 0.15), inset 0 1px 0 rgba(255,255,255,0.1);
            }
            .nav-item.active::before {
                content: ''; position: absolute; left: -24px; top: 25%; width: 4px; height: 50%;
                background: linear-gradient(to bottom, var(--neon-violet), var(--neon-cyan));
                border-radius: 0 4px 4px 0; box-shadow: 0 0 15px var(--neon-violet);
            }
        }

        @media (max-width: 767px) {
            .nav-item { flex-direction: column; gap: 4px; font-size: 10px; flex: 1; padding: 8px 0; border-radius: 14px; }
            .nav-item.active { color: #c084fc; background: rgba(255,255,255,0.02); }
            .nav-item.active i { transform: translateY(-2px); color: #c084fc; filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.8)); }
            .nav-item i { transition: transform 0.4s var(--premium-ease); }
        }
        
        #viewport { transition: opacity 0.6s var(--premium-ease), transform 0.6s var(--premium-ease); overflow-y: auto; position: relative; }
        .fade-out { opacity: 0; pointer-events: none; transform: translateY(15px) scale(0.985); filter: blur(4px); }
        .fade-in { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        #atmospheric-orb { 
            position: fixed; top: -20%; left: 15%; width: 80vw; height: 80vw; 
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(6, 182, 212, 0.04) 35%, transparent 65%); 
            filter: blur(160px); z-index: -1; pointer-events: none; animation: quantumBreathe 16s ease-in-out infinite alternate; 
        }
        #atmospheric-orb-2 { 
            position: fixed; bottom: -15%; right: 5%; width: 60vw; height: 60vw; 
            background: radial-gradient(circle, rgba(6, 182, 212, 0.08) 0%, rgba(168, 85, 247, 0.02) 45%, transparent 70%); 
            filter: blur(120px); z-index: -1; pointer-events: none; animation: quantumBreathe 20s ease-in-out infinite alternate-reverse;
        }

        .app-grid {
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.008) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255, 255, 255, 0.008) 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none; z-index: -1;
        }
        .app-grid::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 20%, #020204 85%);
        }

        .animate-slide-up { opacity: 0; transform: translateY(32px); filter: blur(8px); animation: slideFadeUp 0.8s var(--premium-ease) forwards; }
        .hover-card { transition: all 0.6s var(--premium-ease); position: relative; }
        .hover-card::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            border: 1px solid transparent; background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(6, 182, 212, 0.3)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.5s var(--premium-ease); pointer-events: none;
        }
        .hover-card:hover { 
            transform: translateY(-6px) scale(1.01); 
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(168,85,247,0.08); 
            background: rgba(255,255,255,0.02); 
        }
        .hover-card:hover::after { opacity: 1; }

        /* Orb Architecture */
        .orb-stage { position: relative; width: 100%; max-width: 550px; height: 380px; display: flex; justify-content: center; align-items: center; margin: 0 auto; transition: all 1.2s cubic-bezier(0.2, 1, 0.2, 1); }
        .orb-core { 
            position: absolute; width: 160px; height: 160px; border-radius: 50%; cursor: pointer; 
            background: radial-gradient(circle at 35% 35%, #f3e8ff, #a855f7 30%, #4c1d95 65%, #09090b 95%); 
            box-shadow: inset -12px -12px 30px rgba(0,0,0,0.9), inset 12px 12px 30px rgba(255,255,255,0.5), 0 0 70px rgba(168, 85, 247, 0.35); 
            transition: all 0.5s cubic-bezier(0.2, 1, 0.2, 1); z-index: 10; 
        }
        .orb-core.idle-float { animation: quantumFloat 6s ease-in-out infinite; }
        
        .tech-ring {
            position: absolute; border-radius: 50%; border: 1px dashed rgba(6, 182, 212, 0.2);
            pointer-events: none; z-index: 2; transition: all 1s var(--premium-ease);
        }
        .tr-1 { width: 230px; height: 230px; animation: orb-spin 20s linear infinite; border-top-color: rgba(168,85,247,0.4); }
        .tr-2 { width: 290px; height: 290px; animation: orb-spin 35s linear infinite reverse; border-bottom-color: rgba(6,182,212,0.4); border-style: double; }
        
        .orb-glow { position: absolute; width: 240px; height: 240px; border-radius: 50%; background: conic-gradient(from 180deg, transparent, rgba(168, 85, 247, 0.6), transparent, rgba(6, 182, 212, 0.5), transparent); filter: blur(30px); animation: orb-spin 10s linear infinite; pointer-events: none; z-index: 5; transition: all 1.2s var(--premium-ease); }
        .ripple { position: absolute; width: 160px; height: 160px; border-radius: 50%; border: 1px solid rgba(168, 85, 247, 0.5); opacity: 0; pointer-events: none; z-index: 4; }
        
        #orb-morph-ring { position: absolute; width: 100%; height: 100%; border: 2px solid #c084fc; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 20; transform: scale(0.4); }

        .is-listening .orb-core { background: radial-gradient(circle at 50% 50%, #ffffff, #22d3ee 25%, #0891b2 55%, #4c1d95 85%, #020204); box-shadow: inset -6px -6px 20px rgba(0,0,0,0.7), inset 6px 6px 25px rgba(255,255,255,0.7), 0 0 100px rgba(6, 182, 212, 0.7); }
        .is-listening .orb-glow { width: 320px; height: 320px; filter: blur(40px) brightness(1.5); animation: orb-spin 4s linear infinite; }
        .is-listening .tr-1 { width: 340px; height: 340px; border-color: rgba(6, 182, 212, 0.6); scale: 1.1; }
        .is-listening .tr-2 { width: 400px; height: 400px; border-color: rgba(168, 85, 247, 0.5); scale: 0.9; }
        .is-listening .ripple-1 { animation: ripple-effect 2.2s cubic-bezier(0.05, 0.75, 0.1, 1) infinite; }
        .is-listening .ripple-2 { animation: ripple-effect 2.2s cubic-bezier(0.05, 0.75, 0.1, 1) infinite 1.1s; }

        .orb-stage.is-morphed { height: 520px; max-width: 620px; }
        .is-morphed .orb-core { 
            width: 100%; height: 100%; border-radius: 36px; animation: none; 
            background: linear-gradient(160deg, rgba(10, 10, 14, 0.85) 0%, rgba(4, 4, 6, 0.95) 100%); 
            box-shadow: 0 50px 100px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.1), 0 0 60px rgba(168,85,247,0.05); 
            border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px); 
            cursor: default; transform: scale(1) !important; transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .is-morphed .orb-glow { width: 125%; height: 125%; opacity: 0.25; filter: blur(80px); animation: orb-spin 30s linear infinite; }
        .is-morphed .tech-ring { opacity: 0; scale: 1.5; pointer-events: none; }
        .is-morphed #orb-morph-ring { animation: morph-ring-boom 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .morph-content { position: absolute; inset: 0; z-index: 20; padding: 2.5rem; display: flex; flex-direction: column; pointer-events: none; }
        .is-morphed .morph-content { pointer-events: all; }
        
        .reveal-item { opacity: 0; transform: translateY(20px); filter: blur(6px); }
        .is-morphed .reveal-item { animation: slideFadeUp 0.7s var(--premium-ease) forwards; }
        .is-morphed .delay-1 { animation-delay: 0.35s; } 
        .is-morphed .delay-2 { animation-delay: 0.5s; } 
        .is-morphed .delay-3 { animation-delay: 0.65s; }

        @media (max-width: 768px) {
            .orb-stage.is-morphed { height: 100%; min-height: 460px; }
            .morph-content { padding: 1.75rem; }
            .orb-core { width: 130px; height: 130px; }
            .ripple { width: 130px; height: 130px; }
            .tech-ring { display: none; }
        }

        .live-word { display: inline-block; animation: word-fade-in 0.4s var(--premium-ease) forwards; opacity: 0; filter: blur(5px); transform: translateY(6px); margin-right: 0.25em; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.4); font-weight: 300; }

        /* Lock Screen Styling Optimization for Native iOS Look */
        #lock-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(2, 2, 4, 0.75);
            backdrop-filter: blur(50px) saturate(190%);
            -webkit-backdrop-filter: blur(50px) saturate(190%);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding-top: calc(12vh + env(safe-area-inset-top));
            padding-bottom: calc(6vh + env(safe-area-inset-bottom));
            transition: all 0.55s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .lock-hidden {
            opacity: 0; pointer-events: none; transform: scale(1.08); filter: blur(20px);
        }
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-12px); }
            30% { transform: translateX(12px); }
            45% { transform: translateX(-8px); }
            60% { transform: translateX(8px); }
            75% { transform: translateX(-4px); }
            90% { transform: translateX(4px); }
        }
        .shake { animation: errorShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
        
        /* Modernized iOS Keypad Interactions */
        .ios-key {
            width: 76px; height: 76px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; transition: background-color 0.1s linear, transform 0.1s var(--premium-ease);
            touch-manipulation: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .ios-key:active {
            background-color: rgba(255, 255, 255, 0.28);
            transform: scale(0.94);
        }
        .ios-key-label {
            font-size: 9px; font-weight: 600; tracking-widest; uppercase; margin-top: -2px; opacity: 0.5; font-family: -apple-system, sans-serif;
        }

        /* Animation Matrices */
        @keyframes quantumFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.02); } }
        @keyframes orb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes ripple-effect { 0% { width: 140px; height: 140px; opacity: 0.9; border-width: 2px; border-color: rgba(6, 182, 212, 0.6); } 100% { width: 500px; height: 500px; opacity: 0; border-width: 0.5px; border-color: rgba(168, 85, 247, 0); } }
        @keyframes slideFadeUp { 0% { opacity: 0; transform: translateY(24px); filter: blur(8px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
        @keyframes quantumBreathe { 0% { opacity: 0.3; transform: scale(0.9) translate(0, 0); } 100% { opacity: 0.9; transform: scale(1.15) translate(-4%, 4%); } }
        @keyframes word-fade-in { to { opacity: 1; filter: blur(0); transform: translateY(0); } }
        @keyframes morph-ring-boom { 0% { opacity: 1; transform: scale(0.5); border-width: 4px; border-color: var(--neon-cyan); } 100% { opacity: 0; transform: scale(2.5); border-width: 0px; border-color: var(--neon-violet); } }
    </style>
</head>

        <!-- iPhone Style Bubble Keypad Matrix -->

                <button onclick="SystemLock.pressKey('4')" class="ios-key"><span class="text-3xl font-light">4</span><span class="ios-key-label">G H I</span></button>
                <button onclick="SystemLock.pressKey('5')" class="ios-key"><span class="text-3xl font-light">5</span><span class="ios-key-label">J K L</span></button>

        <div class="px-4 md:mb-16 flex items-center gap-3.5 hidden md:flex">

<script>
    /** --- SYSTEM SECURITY PROTOCOL --- */
    const SystemLock = {
        isLocked: true,
        currentInput: '',
        mode: 'ENTER', // Modes: CREATE, CONFIRM, ENTER
        tempPasscode: '',
        
        init() {
            // Check if passcode registry exists
            const savedPasscode = localStorage.getItem('sys_passcode');
            if (!savedPasscode) {
                this.mode = 'CREATE';
                this.updateUI('Create Passcode', 'Setup a new 4-digit security key');
            } else {
                this.mode = 'ENTER';
                this.updateUI('Enter Passcode', 'Awaiting Authorization');
            }

            // Fallback Desktop Keyboard Entry Binding
            document.addEventListener('keydown', (e) => {
                if (!this.isLocked) return;
                if (e.key >= '0' && e.key <= '9') {
                    this.pressKey(e.key);
                } else if (e.key === 'Backspace') {
                    this.pressDelete();
                }
            });

            // Auto-lock when cursor leaves browser context frames
            document.addEventListener('mouseleave', (e) => {
                if (e.clientY <= 0 || e.clientX <= 0 || (e.clientX >= window.innerWidth || e.clientY >= window.innerHeight)) {
                    if (!this.isLocked) this.lock();
                }
            });
            
            lucide.createIcons();
        },
        updateUI(status, substatus) {
            const statusEl = document.getElementById('lock-status');
            const substatusEl = document.getElementById('lock-substatus');
            if (statusEl) statusEl.innerText = status;
            if (substatusEl) substatusEl.innerText = substatus;
            this.updateDots();
        },
        updateDots() {
            const dotsContainer = document.getElementById('passcode-dots');
            if (!dotsContainer) return;
            const dots = dotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                if (i < this.currentInput.length) {
                    dots[i].classList.remove('border-white/40', 'bg-transparent');
                    dots[i].classList.add('bg-white', 'border-white');
                } else {
                    dots[i].classList.remove('bg-white', 'border-white');
                    dots[i].classList.add('border-white/40', 'bg-transparent');
                }
            }
        },
        pressKey(num) {
            if (this.currentInput.length >= 4) return;
            this.currentInput += num;
            this.updateDots();

            if (this.currentInput.length === 4) {
                setTimeout(() => this.processPasscode(), 250);
            }
        },
        pressDelete() {
            if (this.currentInput.length > 0) {
                this.currentInput = this.currentInput.slice(0, -1);
                this.updateDots();
            }
        },
        processPasscode() {
            if (this.mode === 'CREATE') {
                this.tempPasscode = this.currentInput;
                this.currentInput = '';
                this.mode = 'CONFIRM';
                this.updateUI('Confirm Passcode', 'Re-enter your 4-digit key');
            } else if (this.mode === 'CONFIRM') {
                if (this.currentInput === this.tempPasscode) {
                    localStorage.setItem('sys_passcode', this.currentInput);
                    this.currentInput = '';
                    this.mode = 'ENTER';
                    this.unlock();
                } else {
                    this.triggerError('Match Failed', 'Please try again');
                }
            } else if (this.mode === 'ENTER') {
                const savedPasscode = localStorage.getItem('sys_passcode');
                if (this.currentInput === savedPasscode) {
                    this.unlock();
                } else {
                    this.triggerError('Wrong Passcode', 'Authentication Failed');
                }
            }
        },
        triggerError(status, substatus) {
            this.currentInput = '';
            this.updateUI(status, substatus);
            
            const dotsContainer = document.getElementById('passcode-dots');
            if (dotsContainer) {
                dotsContainer.classList.add('shake');
                setTimeout(() => {
                    dotsContainer.classList.remove('shake');
                    const savedPasscode = localStorage.getItem('sys_passcode');
                    if (!savedPasscode) {
                        this.mode = 'CREATE';
                        this.updateUI('Create Passcode', 'Setup a new 4-digit security key');
                    } else {
                        this.mode = 'ENTER';
                        this.updateUI('Enter Passcode', 'Awaiting Authorization');
                    }
                }, 500);
            }
        },
        unlock() {
            this.isLocked = false;
            this.currentInput = '';
            const screen = document.getElementById('lock-screen');
            screen.classList.add('lock-hidden');
            setTimeout(() => { screen.style.display = 'none'; }, 600);
        },
        lock() {
            this.isLocked = true;
            this.currentInput = '';
            const screen = document.getElementById('lock-screen');
            screen.style.display = 'flex';
            
            requestAnimationFrame(() => {
                screen.classList.remove('lock-hidden');
                const savedPasscode = localStorage.getItem('sys_passcode');
                if (!savedPasscode) {
                    this.mode = 'CREATE';
                    this.updateUI('Create Passcode', 'Setup a new 4-digit security key');
                } else {

        get() { try { const r = localStorage.getItem('dreams_v2'); return r ? JSON.parse(r).map(d => this.normalize(d)) : []; } catch (e) { return []; } },
        save(d) { const ds = this.get(); ds.unshift(this.normalize(d)); localStorage.setItem('dreams_v2', JSON.stringify(ds)); },
        delete(id) { const ds = this.get().filter(d => d.id !== id); localStorage.setItem('dreams_v2', JSON.stringify(ds)); },
        getById(id) { return this.get().find(d => d.id == id); },
        normalize(d) {
            if (!d) d = {};
            return {
                id: d.id || Date.now(), createdAt: d.createdAt || new Date().toISOString(), title: d.title || 'Untitled Stream Sequence', transcript: d.transcript || '', 
                analysis: { type: d.analysis?.type || 'Normal', emotions: Array.isArray(d.analysis?.emotions) ? d.analysis.emotions : [], people: Array.isArray(d.analysis?.people) ? d.analysis.people : [], locations: Array.isArray(d.analysis?.locations) ? d.analysis.locations : [] }, metadata: { deleted: !!d.metadata?.deleted }

        extract(dreams) {
            const p = { locations: {}, people: {}, emotions: {}, types: { Normal: 0, Lucid: 0, Nightmare: 0 } };
            dreams.forEach(d => {
                if (!d.analysis) return;
                const type = d.analysis.type;
                if(p.types[type] !== undefined) p.types[type]++; else p.types['Normal']++;
                ['emotions', 'locations', 'people'].forEach(cat => {
                    if (Array.isArray(d.analysis[cat])) {
                        d.analysis[cat].forEach(item => { 
                            if(item) { const norm = item.charAt(0).toUpperCase() + item.slice(1).toLowerCase(); p[cat][norm] = (p[cat][norm] || 0) + 1; }
                        });
                    }
                });
            });
            const sortMap = (map) => Object.entries(map).sort((a,b) => b[1] - a[1]).map(([name, count]) => ({name, count}));
            return { types: p.types, emotions: sortMap(p.emotions), locations: sortMap(p.locations), people: sortMap(p.people) };
        }
    };

                            </div>
                            
                            <div class="reveal-item delay-2 flex-1 glass-card rounded-2xl p-5 overflow-y-auto mb-5 border-white/5 bg-black/60 shadow-inner">
                                <p id="morph-transcript" class="text-zinc-300 text-xs md:text-sm leading-relaxed font-light tracking-wide"></p>
                            </div>
                            
                            <button onclick="OrbEngine.saveAndRoute()" class="reveal-item delay-3 w-full py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-cyan-500 text-white font-bold tracking-wider hover:brightness-110 transition-all shadow-[0_0_30px_rgba(168,85,247,0.3)] flex items-center justify-center gap-2 text-xs uppercase font-mono">
                                <i data-lucide="shield-alert" class="w-4 h-4"></i> Commit Telemetry Array
                            </button>
                        </div>
                    </div>

                    <div id="live-feedback" class="mt-6 text-center text-lg md:text-xl font-light text-zinc-400 max-w-xl w-full h-24 overflow-y-auto scrollbar-hide transition-all duration-500 opacity-0 px-6 translate-y-4"></div>
                    
                    <!-- Manual Text Entry Frame -->
                    <div id="text-stage" class="hidden w-full max-w-2xl mx-auto animate-slide-up flex-col gap-4 mt-4" style="animation-delay: 0.15s">
                        <textarea id="manual-transcript" class="glass-card w-full h-48 bg-black/40 text-zinc-200 rounded-2xl p-5 text-sm md:text-base leading-relaxed tracking-wide resize-none outline-none focus:border-purple-500/50 focus:ring-2 focus:ring-purple-500/20 transition-all placeholder-zinc-600 font-light" placeholder="Initiate manual entry sequence... Type out the locations, emotions, and occurrences..."></textarea>
                        <button onclick="OrbEngine.saveTextAndRoute()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-cyan-500 text-white font-bold tracking-wider hover:brightness-110 transition-all shadow-[0_0_30px_rgba(168,85,247,0.3)] flex items-center justify-center gap-2 text-xs uppercase font-mono mt-2">
                            <i data-lucide="keyboard" class="w-4 h-4"></i> Commit Manual Telemetry
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
            this.isRecording = false;
            this.finalTranscript = '';
            this.displayedWords = [];
            this.activeMode = 'orb';
            
            const SpeechTarget = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechTarget) {
                document.getElementById('orb-hint').innerText = "VCN_ERR";
            } else {
                this.recognition = new SpeechTarget();
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                
                this.recognition.onresult = (e) => {
                    this.finalTranscript = Array.from(e.results).map(r => r[0].transcript).join('');
                    this.renderLiveText();
                    
                    // Direct dynamic insertion inside morphed window view if opened
                    const mt = document.getElementById('morph-transcript');
                    if(mt) mt.innerText = this.finalTranscript;
                };
            }
        },

        setMode(mode) {
            this.activeMode = mode;
            const btnOrb = document.getElementById('btn-mode-orb');
            const btnText = document.getElementById('btn-mode-text');
            const stageOrb = document.getElementById('orb-stage');
            const stageText = document.getElementById('text-stage');
            const liveFeedback = document.getElementById('live-feedback');

            if (mode === 'orb') {
                btnOrb.className = "px-4 py-2 rounded-xl text-[10px] font-mono font-bold uppercase tracking-widest transition-all bg-purple-500/20 text-purple-400 border border-purple-500/30";
                btnText.className = "px-4 py-2 rounded-xl text-[10px] font-mono font-bold uppercase tracking-widest transition-all bg-white/5 text-zinc-500 border border-white/5 hover:text-white";
                
                stageOrb.classList.remove('hidden');
                stageOrb.classList.add('flex');
                stageText.classList.add('hidden');
                stageText.classList.remove('flex');
                liveFeedback.style.display = 'block';
            } else {
                btnText.className = "px-4 py-2 rounded-xl text-[10px] font-mono font-bold uppercase tracking-widest transition-all bg-cyan-500/20 text-cyan-400 border border-cyan-500/30";
                btnOrb.className = "px-4 py-2 rounded-xl text-[10px] font-mono font-bold uppercase tracking-widest transition-all bg-white/5 text-zinc-500 border border-white/5 hover:text-white";
                
                stageOrb.classList.add('hidden');
                stageOrb.classList.remove('flex');
                stageText.classList.remove('hidden');
                stageText.classList.add('flex');
                liveFeedback.style.display = 'none';
                
                if (this.isRecording) this.stop();
            }
        },

        renderLiveText() {
            const fb = document.getElementById('live-feedback');
            if(!fb || !this.finalTranscript) return;
            
            const currentWords = this.finalTranscript.trim().split(/\s+/);
            
            if (currentWords.length > this.displayedWords.length) {
                const newWords = currentWords.slice(this.displayedWords.length);
                newWords.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'live-word';
                    span.innerText = w;
                    fb.appendChild(span);
                    fb.appendChild(document.createTextNode(' '));
                });
                this.displayedWords = currentWords;
                fb.scrollTop = fb.scrollHeight;
            } else if (currentWords.length < this.displayedWords.length || (currentWords.length > 0 && currentWords[0] !== this.displayedWords[0])) {
                fb.innerHTML = currentWords.map(w => `<span class="live-word" style="animation:none; opacity:1; filter:blur(0); transform:none;">${w}</span> `).join('');
                this.displayedWords = currentWords;
            } else if (currentWords.length === this.displayedWords.length) {
                const lastSpan = fb.querySelector('.live-word:last-of-type');
                if(lastSpan) lastSpan.innerText = currentWords[currentWords.length - 1];
            }
        },

        async startAudioReactive() {
            try {
                if(!navigator.mediaDevices) return;
                this.audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioCtx.createAnalyser();
                this.analyser.fftSize = 256;
                const source = this.audioCtx.createMediaStreamSource(this.audioStream);
                source.connect(this.analyser);
                this.audioData = new Uint8Array(this.analyser.frequencyBinCount);
                this.tickAudio();
            } catch(err) {
                console.log("Telemetry wave bypassed", err);
            }
        },

        tickAudio() {
            if(!this.isRecording) return;
            if(this.analyser && this.audioData) {
                this.analyser.getByteFrequencyData(this.audioData);
                let sum = 0; for(let i = 0; i < this.audioData.length; i++) sum += this.audioData[i];
                let avg = sum / this.audioData.length;
                
                const orb = document.getElementById('orb-core');
                if (orb && !document.getElementById('orb-stage').classList.contains('is-morphed')) {
                    const volumeScale = 1.02 + (avg / 256) * 0.35; 
                    orb.style.transform = `scale(${volumeScale})`;
                    orb.style.boxShadow = `inset -12px -12px 30px rgba(0,0,0,0.8), inset 12px 12px 30px rgba(255,255,255,0.6), 0 0 ${60 + (avg * 1.5)}px rgba(6, 182, 212, ${0.4 + (avg/180)})`;
                }
            }
            requestAnimationFrame(() => this.tickAudio());
        },

        toggle() {
            if(document.getElementById('orb-stage').classList.contains('is-morphed')) return;
            if(!this.isRecording) this.start(); else this.stop();
        },

        start() {
            if(!this.recognition) return;
            this.isRecording = true;
            this.finalTranscript = '';
            this.displayedWords = [];
            
            try {
                this.recognition.start();
                this.startAudioReactive();
            } catch(e) { console.log(e); }
            
            const stage = document.getElementById('orb-stage');
            stage.classList.add('is-listening');
            
            document.getElementById('orb-hint').innerText = "LISTENING";
            document.getElementById('live-feedback').style.opacity = '1';
            document.getElementById('live-feedback').innerHTML = '<span class="text-zinc-600 text-sm font-mono tracking-widest">TRANSMISSION STREAM OPEN...</span>';

            // Automatic terminal change threshold to morph window on silence or capture
            setTimeout(() => {
                if(this.isRecording) {
                    this.stop();
                }
            }, 12000);
        },

        stop() {
            this.isRecording = false;
            try {
                this.recognition.stop();
                if(this.audioStream) this.audioStream.getTracks().forEach(t => t.stop());
            } catch(e) { console.log(e); }
            
            const stage = document.getElementById('orb-stage');
            stage.classList.remove('is-listening');
            stage.classList.add('is-morphed'); 

            setTimeout(() => { 
                const inst = document.getElementById('orb-instructions');
                if (inst) inst.style.display = 'none'; 
            }, 400);
            
            const fb = document.getElementById('live-feedback');
            if (fb) fb.style.opacity = '0';
            
            setTimeout(() => {
                const mt = document.getElementById('morph-transcript');
                if (mt) mt.innerText = this.finalTranscript.trim() || "No telemetry stream captured. Neural transmission dropped.";
            }, 100);
        },

        saveTextAndRoute() {
            const manualText = document.getElementById('manual-transcript').value;
            this.processAndSave(manualText);
        },

        saveAndRoute() {
            this.processAndSave(this.finalTranscript);
        },

        processAndSave(rawData) {
            if (rawData.trim()) {
                const text = rawData.toLowerCase();
                
                const knownPlaces = ['paris', 'london', 'tokyo', 'new york', 'berlin', 'rome', 'house', 'school', 'beach', 'city', 'forest', 'ocean', 'street', 'office', 'room', 'car', 'mall', 'mountain', 'hospital', 'airport', 'hotel'];
                const knownEmotions = ['happy', 'sad', 'angry', 'scared', 'anxious', 'calm', 'confused', 'excited', 'terrified', 'joyful', 'frustrated', 'peaceful', 'panicked'];
                
                const extLocations = knownPlaces.filter(p => text.includes(p));
                const extEmotions = knownEmotions.filter(e => text.includes(e));
                
                const tokens = rawData.split(/\s+/);
                for(let i = 0; i < tokens.length - 1; i++) {
                    const currentLower = tokens[i].toLowerCase();
                    if(['in', 'at', 'to', 'from', 'near'].includes(currentLower)) {
                        const nextWord = tokens[i+1].replace(/[^a-zA-Z]/g, '');
                        if(nextWord.length > 2 && nextWord[0] === nextWord[0].toUpperCase()) extLocations.push(nextWord.toLowerCase());
                    }
                }
                
                let detectedType = 'Normal';
                if(text.includes('lucid') || text.includes('control') || text.includes('aware')) detectedType = 'Lucid';
                else if(text.includes('nightmare') || text.includes('scared') || text.includes('terrified') || text.includes('monster') || text.includes('run')) detectedType = 'Nightmare';

                Store.save({
                    title: rawData.slice(0, 40) + (rawData.length > 40 ? '...' : ''), 
                    transcript: rawData, 
                    analysis: {
                        type: detectedType,
                        people: this.extractNames(rawData),
                        locations: [...new Set(extLocations)].map(p => p.charAt(0).toUpperCase() + p.slice(1)),
                        emotions: [...new Set(extEmotions)].map(p => p.charAt(0).toUpperCase() + p.slice(1))
                    }
                });
            }
            Router.navigate('archive');
        },

        extractNames(text) {
            if (!text) return [];
            const tokens = text.split(/\s+/);
            const names = [];
            for (let i = 1; i < tokens.length; i++) {
                const word = tokens[i].replace(/[^a-zA-Z]/g, '');
                if (word.length > 2 && word[0] === word[0].toUpperCase() && word.slice(1) === word.slice(1).toLowerCase()) {
                    names.push(word);
                }
            }
            return [...new Set(names)];
        }
    };

    /** --- SYSTEM VIEWPORT NAVIGATION ROUTER --- */
    const Router = {
        async navigate(pageId) {
            const v = document.getElementById('viewport'); if(!v) return;
            
            v.classList.remove('fade-in');
            v.classList.add('fade-out');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === pageId));
            
            await new Promise(r => setTimeout(r, 400));
            
            if (pageId === 'record') OrbEngine.init(v);
            else if (pageId === 'archive') ArchiveModule.render();
            else if (pageId === 'analytics') AnalyticsModule.render();
            
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    v.classList.remove('fade-out'); 
                    v.classList.add('fade-in');
                });
            });
        }
    };

    // Global Interactive Listeners
    document.getElementById('nav-menu').addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link && link.dataset.page) { 
            e.preventDefault(); 
            Router.navigate(link.dataset.page); 
        }
    });

    // Fire Interface Sequence
    Router.navigate('record');
    
    // Initialize Security Protocol
    SystemLock.init();
</script>
