<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DreamOS // Hyper-Neural Engine v8.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #010103; 
            --ui-border: rgba(255, 255, 255, 0.08);
            --neon-violet: #8b5cf6;
            --neon-cyan: #06b6d4;
            --premium-ease: cubic-bezier(0.16, 1, 0.3, 1); 
            --bounce-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        body { 
            background-color: var(--bg); 
            color: #f4f4f6; 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ultra-Fine Organic Noise Overlay */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 99999; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.025'/%3E%3C/svg%3E");
        }

        .heading-font { font-family: 'Space Grotesk', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        
        /* Advanced Glassmorphism Matrix */
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.035) 0%, rgba(255, 255, 255, 0.005) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(50px) saturate(180%);
            -webkit-backdrop-filter: blur(50px) saturate(180%);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* Floating Sidebar Upgrade */
        .floating-sidebar {
            background: linear-gradient(180deg, rgba(12, 12, 20, 0.6) 0%, rgba(2, 2, 6, 0.8) 100%);
            backdrop-filter: blur(50px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 25px 0 70px -15px rgba(0, 0, 0, 0.9), inset 1px 1px 0 rgba(255,255,255,0.08);
        }

        /* Nav Interface Hyper-Fluid State */
        .nav-item { 
            transition: all 0.5s var(--bounce-ease); 
            color: #71717a; 
            border-radius: 18px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: 600; 
            position: relative;
            overflow: hidden;
        }
        
        @media (min-width: 768px) {
            .nav-item {
                justify-content: flex-start;
                padding: 16px 24px; 
                gap: 16px; 
                font-size: 14px;
                border: 1px solid transparent;
            }
            .nav-item::before {
                content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(139,92,246,0.12), transparent); opacity: 0; transition: opacity 0.4s ease;
            }
            .nav-item:hover { 
                color: #e4e4e7; 
                transform: translateX(8px);
                border-color: rgba(255, 255, 255, 0.08);
            }
            .nav-item:hover::before { opacity: 1; }
            .nav-item.active { 
                background: linear-gradient(135deg, rgba(139, 92, 246, 0.2) 0%, rgba(6, 182, 212, 0.06) 100%); 
                color: #c4b5fd; 
                border: 1px solid rgba(139, 92, 246, 0.5);
                box-shadow: 0 12px 35px rgba(139, 92, 246, 0.25), inset 0 1px 0 rgba(255,255,255,0.2);
                transform: scale(1.02) translateX(4px);
            }
            .nav-item.active i { color: #ede9fe; filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.9)); }
        }

        @media (max-width: 767px) {
            .nav-item { flex-direction: column; gap: 6px; font-size: 10px; flex: 1; padding: 12px 0; border-radius: 20px; }
            .nav-item.active { color: #c4b5fd; background: rgba(255,255,255,0.05); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); }
            .nav-item.active i { transform: translateY(-4px) scale(1.15); color: #ede9fe; filter: drop-shadow(0 0 12px rgba(139, 92, 246, 1)); }
            .nav-item i { transition: all 0.5s var(--bounce-ease); }
        }
        
        #viewport { transition: opacity 0.7s var(--premium-ease), transform 0.7s var(--premium-ease); overflow-y: auto; position: relative; scroll-behavior: smooth; }
        .fade-out { opacity: 0; pointer-events: none; transform: translateY(30px) scale(0.95) rotateX(5deg); filter: blur(12px); }
        .fade-in { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); filter: blur(0); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* Environmental Ambient Orbs */
        #atmospheric-orb { 
            position: fixed; top: -10%; left: 5%; width: 90vw; height: 90vw; 
            background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(6, 182, 212, 0.06) 40%, transparent 75%); 
            filter: blur(150px); z-index: -1; pointer-events: none; animation: quantumBreathe 14s ease-in-out infinite alternate; 
        }
        #atmospheric-orb-2 { 
            position: fixed; bottom: -20%; right: -10%; width: 85vw; height: 85vw; 
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 80%); 
            filter: blur(120px); z-index: -1; pointer-events: none; animation: quantumBreathe 18s ease-in-out infinite alternate-reverse;
        }

        .app-grid {
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none; z-index: -1;
            transform: perspective(1000px) rotateX(60deg) scale(2.5) translateY(-20%);
            transform-origin: top center;
            opacity: 0.45;
            animation: gridMove 25s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }
        .app-grid::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 30%, transparent 15%, var(--bg) 75%);
        }

        .animate-slide-up { opacity: 0; transform: translateY(40px) scale(0.98); filter: blur(12px); animation: slideFadeUp 1s var(--bounce-ease) forwards; }
        
        /* Insane Card Hover Physics */
        .hover-card { transition: all 0.6s var(--bounce-ease); position: relative; transform-style: preserve-3d; }
        .hover-card::before {
            content: ''; position: absolute; inset: -2px; border-radius: inherit; z-index: -1;
            background: linear-gradient(135deg, var(--neon-violet), var(--neon-cyan), var(--neon-violet));
            background-size: 200% auto; opacity: 0; transition: opacity 0.5s ease; filter: blur(14px);
        }
        .hover-card::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            border: 1px solid transparent; background: linear-gradient(135deg, rgba(139, 92, 246, 0.7), rgba(6, 182, 212, 0.7)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.5s var(--premium-ease); pointer-events: none;
        }
        .hover-card:hover { 
            transform: translateY(-12px) scale(1.02) rotateX(2deg) rotateY(1deg); 
            box-shadow: 0 45px 90px -20px rgba(0,0,0,0.85), 0 0 60px rgba(139,92,246,0.18); 
            background: rgba(255,255,255,0.05); 
        }
        .hover-card:hover::before, .hover-card:hover::after { opacity: 1; animation: gradientShift 3s linear infinite; }

        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Organic Orb Architecture */
        .orb-stage { position: relative; width: 100%; max-width: 550px; height: 420px; display: flex; justify-content: center; align-items: center; margin: 0 auto; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); perspective: 1000px; }
        
        @keyframes fluidShape {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            33% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            66% { border-radius: 50% 40% 60% 40% / 40% 50% 40% 60%; }
        }

        .orb-core { 
            position: absolute; width: 190px; height: 190px; cursor: pointer; 
            background: radial-gradient(circle at 30% 30%, #fff, #c084fc 20%, #581c87 60%, #010103 100%); 
            box-shadow: inset -18px -18px 45px rgba(0,0,0,0.9), inset 18px 18px 45px rgba(255,255,255,0.85), 0 0 90px rgba(139, 92, 246, 0.45); 
            transition: all 0.5s var(--premium-ease); z-index: 10; 
            animation: fluidShape 8s ease-in-out infinite, quantumFloat 6s ease-in-out infinite;
        }
        
        .tech-ring {
            position: absolute; border-radius: 50%; border: 1px dashed rgba(6, 182, 212, 0.35);
            pointer-events: none; z-index: 2; transition: all 1s var(--premium-ease); transform-style: preserve-3d;
        }
        .tr-1 { width: 270px; height: 270px; animation: orb-spin-3d 20s linear infinite; border-top-color: rgba(139,92,246,0.65); border-width: 2px; }
        .tr-2 { width: 350px; height: 350px; animation: orb-spin-3d 30s linear infinite reverse; border-bottom-color: rgba(6,182,212,0.65); border-style: dotted; border-width: 3px; }
        
        @keyframes orb-spin-3d { from { transform: rotateX(60deg) rotateY(20deg) rotateZ(0deg); } to { transform: rotateX(60deg) rotateY(20deg) rotateZ(360deg); } }

        .orb-glow { position: absolute; width: 280px; height: 280px; border-radius: 50%; background: conic-gradient(from 180deg, transparent, rgba(139, 92, 246, 0.85), transparent, rgba(6, 182, 212, 0.85), transparent); filter: blur(45px); animation: orb-spin 8s linear infinite; pointer-events: none; z-index: 5; transition: all 0.8s var(--premium-ease); opacity: 0.75; }
        
        .ripple { position: absolute; width: 190px; height: 190px; border-radius: 50%; border: 2px solid rgba(139, 92, 246, 0.65); opacity: 0; pointer-events: none; z-index: 4; }
        
        #orb-morph-ring { position: absolute; width: 100%; height: 100%; border: 4px solid #c084fc; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 20; transform: scale(0.4); box-shadow: 0 0 60px #c084fc; }

        /* Active Listening State */
        .is-listening .orb-core { 
            background: radial-gradient(circle at 50% 50%, #ffffff, #22d3ee 30%, #0891b2 70%, #010103 100%); 
            box-shadow: inset -12px -12px 35px rgba(0,0,0,0.85), inset 12px 12px 40px rgba(255,255,255,0.95), 0 0 130px rgba(6, 182, 212, 0.95); 
            animation: fluidShape 3s ease-in-out infinite, pulseGlow 1s infinite alternate;
        }
        @keyframes pulseGlow { from { filter: brightness(1); } to { filter: brightness(1.35); transform: scale(1.06); } }

        .is-listening .orb-glow { width: 400px; height: 400px; filter: blur(55px) brightness(1.9); animation: orb-spin 3s linear infinite; }
        .is-listening .tr-1 { width: 420px; height: 420px; border-color: rgba(6, 182, 212, 0.85); border-width: 4px; transform: rotateX(70deg) rotateY(0) scale(1.2); }
        .is-listening .tr-2 { width: 500px; height: 500px; border-color: rgba(139, 92, 246, 0.75); border-width: 2px; transform: rotateX(50deg) rotateY(30deg) scale(0.85); }
        .is-listening .ripple-1 { animation: ripple-effect 2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
        .is-listening .ripple-2 { animation: ripple-effect 2s cubic-bezier(0.16, 1, 0.3, 1) infinite 1s; }

        /* Morphed State (Result Expansion) */
        .orb-stage.is-morphed { height: 660px; max-width: 680px; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .is-morphed .orb-core { 
            width: 100%; height: 100%; border-radius: 40px !important; animation: none !important; 
            background: linear-gradient(160deg, rgba(16, 16, 24, 0.88) 0%, rgba(4, 4, 10, 0.99) 100%); 
            box-shadow: 0 70px 140px -20px rgba(0,0,0,1), inset 0 2px 4px rgba(255,255,255,0.25), 0 0 90px rgba(139,92,246,0.12); 
            border: 1px solid rgba(255,255,255,0.16); backdrop-filter: blur(65px); -webkit-backdrop-filter: blur(65px); 
            cursor: default; transform: scale(1) !important; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .is-morphed .orb-glow { width: 140%; height: 140%; opacity: 0.15; filter: blur(110px); animation: orb-spin 40s linear infinite; }
        .is-morphed .tech-ring { opacity: 0; scale: 2; pointer-events: none; }
        .is-morphed #orb-morph-ring { animation: morph-ring-boom 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .morph-content { position: absolute; inset: 0; z-index: 20; padding: 2.5rem; display: flex; flex-direction: column; pointer-events: none; opacity: 0; transition: opacity 0.4s ease 0.2s; }
        .is-morphed .morph-content { pointer-events: all; opacity: 1; }
        
        .reveal-item { opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .is-morphed .reveal-item { opacity: 1; transform: translateY(0); }
        .is-morphed .delay-1 { transition-delay: 0.2s; } 
        .is-morphed .delay-2 { transition-delay: 0.3s; } 
        .is-morphed .delay-3 { transition-delay: 0.4s; }

        @media (max-width: 768px) {
            .orb-stage.is-morphed { height: 100%; min-height: 580px; }
            .morph-content { padding: 1.5rem; }
            .orb-core { width: 160px; height: 160px; }
            .ripple { width: 160px; height: 160px; }
            .tech-ring { display: none; }
        }

        .live-word { display: inline-block; animation: word-fade-in 0.5s var(--bounce-ease) forwards; opacity: 0; filter: blur(8px) brightness(2); transform: translateY(10px) scale(1.2); margin-right: 0.25em; color: #fff; text-shadow: 0 0 20px rgba(6, 182, 212, 0.85); font-weight: 500; }

        /* Lock Screen Upgrade - iPhone Style 4-Digit Passcode Matrix */
        #lock-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, rgba(12,12,20,0.95) 0%, rgba(1,1,3,1) 100%);
            backdrop-filter: blur(90px) saturate(200%);
            -webkit-backdrop-filter: blur(90px) saturate(200%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 2rem;
            transition: all 0.7s cubic-bezier(0.7, 0, 0.3, 1);
        }
        
        #lock-screen::before {
            content: ''; position: absolute; inset: 0; 
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
            pointer-events: none; z-index: -1;
            animation: scanline 12s linear infinite;
        }
        @keyframes scanline { from { transform: translateY(-100%); } to { transform: translateY(100%); } }

        .lock-hidden { opacity: 0; pointer-events: none; transform: scale(1.15) translateY(-50px); filter: blur(35px); }
        
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); filter: brightness(1.5); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .shake { animation: errorShake 0.4s ease both; }

        /* iPhone Passcode Dots */
        .passcode-dot {
            width: 16px; height: 16px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: transparent; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .passcode-dot.filled {
            background: #ffffff; border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(139, 92, 246, 0.8);
            transform: scale(1.15);
        }

        /* iOS Glass Keypad Buttons */
        .num-key {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 50%;
            width: 80px; height: 80px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 500;
            cursor: pointer; transition: all 0.2s var(--bounce-ease);
            user-select: none; touch-manipulation: manipulation; -webkit-tap-highlight-color: transparent;
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .num-key:hover {
            border-color: rgba(139, 92, 246, 0.7);
            background: rgba(139, 92, 246, 0.2);
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.4);
            transform: scale(1.05);
        }
        .num-key:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(6, 182, 212, 0.9);
        }
        .num-sub {
            font-size: 9px; font-family: 'JetBrains Mono', monospace; font-weight: bold; tracking: 0.2em; text-transform: uppercase; margin-top: -2px; color: #a1a1aa;
        }

        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -8px;
            box-shadow: 0 0 18px rgba(6, 182, 212, 0.85), 0 2px 6px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.95);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Animation Matrices */
        @keyframes quantumFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
        @keyframes orb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes ripple-effect { 0% { width: 190px; height: 190px; opacity: 1; border-width: 4px; border-color: rgba(6, 182, 212, 1); transform: scale(1); } 100% { width: 750px; height: 750px; opacity: 0; border-width: 0px; border-color: rgba(139, 92, 246, 0); transform: scale(1.5); } }
        @keyframes slideFadeUp { 0% { opacity: 0; transform: translateY(40px) scale(0.98); filter: blur(12px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes quantumBreathe { 0% { opacity: 0.2; transform: scale(0.8) translate(5%, -5%); } 100% { opacity: 0.85; transform: scale(1.2) translate(-5%, 5%); } }
        @keyframes word-fade-in { to { opacity: 1; filter: blur(0) brightness(1); transform: translateY(0) scale(1); } }
        @keyframes morph-ring-boom { 0% { opacity: 1; transform: scale(0.5); border-width: 8px; border-color: var(--neon-cyan); box-shadow: 0 0 100px var(--neon-cyan); } 100% { opacity: 0; transform: scale(3.5); border-width: 0px; border-color: var(--neon-violet); box-shadow: 0 0 0px var(--neon-violet); } }
    </style>
</head>
<body class="bg-[#010103]">

    <!-- iPhone Style Passcode / Setup Vault Screen -->
    <div id="lock-screen" class="select-none flex">
        <div class="flex flex-col items-center text-center animate-slide-up max-w-md w-full">
            <div class="relative mb-6 group">
                <div class="absolute inset-0 bg-gradient-to-r from-purple-500 to-cyan-500 rounded-full blur-xl opacity-40 group-hover:opacity-70 transition-opacity duration-700 animate-pulse"></div>
                <div class="w-16 h-16 rounded-full border-2 border-white/20 bg-black/60 backdrop-blur-md flex items-center justify-center relative z-10 shadow-[0_0_50px_rgba(255,255,255,0.12)]">
                    <i data-lucide="lock" id="lock-icon" class="w-7 h-7 text-white/95"></i>
                </div>
            </div>
            <h1 id="lock-status" class="text-2xl font-bold tracking-wider text-white heading-font">Enter Passcode</h1>
            <p id="lock-substatus" class="text-[11px] text-cyan-400 font-mono tracking-[0.2em] uppercase mt-2 opacity-85">4-Digit Numeral Code Required</p>
            
            <!-- Passcode Dot Indicators (4 digits) -->
            <div id="passcode-dots" class="flex gap-4 my-8">
                <div class="passcode-dot" data-index="0"></div>
                <div class="passcode-dot" data-index="1"></div>
                <div class="passcode-dot" data-index="2"></div>
                <div class="passcode-dot" data-index="3"></div>
            </div>
        </div>

        <!-- iPhone Numeric Keypad Matrix -->
        <div class="flex flex-col items-center w-full max-w-xs animate-slide-up" style="animation-delay: 0.1s">
            <div class="grid grid-cols-3 gap-5 mb-5">
                <button onclick="SystemLock.pressKey('1')" class="num-key">1<span class="num-sub">&nbsp;</span></button>
                <button onclick="SystemLock.pressKey('2')" class="num-key">2<span class="num-sub">ABC</span></button>
                <button onclick="SystemLock.pressKey('3')" class="num-key">3<span class="num-sub">DEF</span></button>
                <button onclick="SystemLock.pressKey('4')" class="num-key">4<span class="num-sub">GHI</span></button>
                <button onclick="SystemLock.pressKey('5')" class="num-key">5<span class="num-sub">JKL</span></button>
                <button onclick="SystemLock.pressKey('6')" class="num-key">6<span class="num-sub">MNO</span></button>
                <button onclick="SystemLock.pressKey('7')" class="num-key">7<span class="num-sub">PQRS</span></button>
                <button onclick="SystemLock.pressKey('8')" class="num-key">8<span class="num-sub">TUV</span></button>
                <button onclick="SystemLock.pressKey('9')" class="num-key">9<span class="num-sub">WXYZ</span></button>
            </div>
            <div class="flex gap-5 w-full justify-center items-center">

<script>
    /** --- SYSTEM SECURITY PROTOCOL (IPHONE 4-DIGIT PASSCODE & CREATION FLOW) --- */
    const SystemLock = {
        currentInput: '',
        mode: 'verify', // 'verify', 'create', 'confirm'
        tempPasscode: '',
        
        init() {
            const savedPasscode = localStorage.getItem('dreamos_passcode');
            if (!savedPasscode) {
                this.mode = 'create';
                this.updatePrompt('Create Passcode', 'Enter a new 4-digit passcode');
            } else {
                this.mode = 'verify';
                this.updatePrompt('Enter Passcode', '4-digit numeral code for iPhone');
            }
            this.updateDots();

            // Keyboard input support
            document.addEventListener('keydown', (e) => {
                if (document.getElementById('lock-screen').style.display === 'none') return;
                if (e.key === 'Backspace') {
                    this.deleteKey();
                } else if (e.key.length === 1 && /^[0-9]$/.test(e.key)) {
                    this.pressKey(e.key);
                }
            });
            
            lucide.createIcons();
        },

        updatePrompt(title, subtitle) {
            const statusEl = document.getElementById('lock-status');
            const substatusEl = document.getElementById('lock-substatus');
            if (statusEl) statusEl.innerText = title;
            if (substatusEl) substatusEl.innerText = subtitle;
        },

        updateDots() {
            const dots = document.querySelectorAll('.passcode-dot');
            dots.forEach((dot, index) => {
                if (index < this.currentInput.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });
        },

        pressKey(num) {
            if (this.currentInput.length < 4) {
                this.currentInput += num;
                this.updateDots();
                
                if (this.currentInput.length === 4) {
                    setTimeout(() => this.handleComplete(), 150);
                }
            }
        },

        deleteKey() {
            if (this.currentInput.length > 0) {
                this.currentInput = this.currentInput.slice(0, -1);
                this.updateDots();
            }
        },

        handleComplete() {
            const savedPasscode = localStorage.getItem('dreamos_passcode');

            if (this.mode === 'verify') {
                if (this.currentInput === savedPasscode) {
                    this.unlock();
                } else {
                    this.triggerError('Incorrect Passcode');
                }
            } else if (this.mode === 'create') {
                this.tempPasscode = this.currentInput;
                this.currentInput = '';
                this.mode = 'confirm';
                this.updatePrompt('Confirm Passcode', 'Re-enter your 4-digit passcode');
                this.updateDots();
            } else if (this.mode === 'confirm') {
                if (this.currentInput === this.tempPasscode) {
                    localStorage.setItem('dreamos_passcode', this.currentInput);
                    this.unlock();
                } else {
                    this.triggerError('Passcodes Did Not Match');
                    this.tempPasscode = '';
                    this.mode = 'create';
                    this.updatePrompt('Create Passcode', 'Enter a new 4-digit passcode');
                }
            }
        },

        resetPasscodeFlow() {
            localStorage.removeItem('dreamos_passcode');
            this.currentInput = '';
            this.tempPasscode = '';
            this.mode = 'create';
            this.updatePrompt('Create Passcode', 'Enter a new 4-digit passcode');
            this.updateDots();
        },

        triggerError(status) {
            const statusEl = document.getElementById('lock-status');
            if (statusEl) statusEl.innerText = status;
            
            const dotsContainer = document.getElementById('passcode-dots');
            if (dotsContainer) {
                dotsContainer.classList.add('shake');
                setTimeout(() => {
                    dotsContainer.classList.remove('shake');
                    if (this.mode === 'verify') {
                        this.updatePrompt('Enter Passcode', '4-digit numeral code for iPhone');
                    } else if (this.mode === 'create') {
                        this.updatePrompt('Create Passcode', 'Enter a new 4-digit passcode');
                    } else if (this.mode === 'confirm') {
                        this.updatePrompt('Confirm Passcode', 'Re-enter your 4-digit passcode');
                    }
                    this.currentInput = '';
                    this.updateDots();
                }, 600);
            }
        },

        unlock() {
            this.currentInput = '';
            const screen = document.getElementById('lock-screen');
            const appCore = document.getElementById('app-core');
            
            screen.classList.add('lock-hidden');
            appCore.classList.remove('hidden');
            appCore.classList.add('flex');
            
            setTimeout(() => { screen.style.display = 'none'; }, 700);
        },

        lock() {
            this.currentInput = '';
            const savedPasscode = localStorage.getItem('dreamos_passcode');
            this.mode = savedPasscode ? 'verify' : 'create';
            if (this.mode === 'verify') {
                this.updatePrompt('Enter Passcode', '4-digit numeral code for iPhone');
            } else {
                this.updatePrompt('Create Passcode', 'Enter a new 4-digit passcode');
            }

            const screen = document.getElementById('lock-screen');
            const appCore = document.getElementById('app-core');
            
            screen.style.display = 'flex';
            appCore.classList.add('hidden');
            appCore.classList.remove('flex');
            
            requestAnimationFrame(() => {
                screen.classList.remove('lock-hidden');
                this.updateDots();
            });
        }
    };

    /** --- NEURAL LANGUAGE PROCESSING (NLP) ENGINE --- */
    const NLPEngine = {
        extract(text) {
            if (!text) return { type: 'Normal', people: [] };
            
            const words = text.match(/\b[a-zA-Z]+\b/g) || [];
            let extNames = new Set();

            const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
            sentences.forEach(sentence => {
                const sentenceTokens = sentence.trim().split(/\s+/);
                for (let i = 1; i < sentenceTokens.length; i++) {
                    let word = sentenceTokens[i].replace(/[^a-zA-Z]/g, '');
                    if (word.length > 2 && word[0] === word[0].toUpperCase() && word.slice(1) === word.slice(1).toLowerCase()) {
                        extNames.add(word);
                    }
                }
            });

            let type = 'Normal';
            const lucidTriggers = ['lucid', 'control', 'aware', 'realize', 'awake', 'knew', 'conscious', 'flew'];
            const nightmareTriggers = ['nightmare', 'scared', 'terrified', 'monster', 'run', 'chased', 'died', 'kill', 'dark', 'demon', 'ghost', 'trapped', 'scream', 'blood', 'fall'];
            const recurringTriggers = ['again', 'always', 'recurring', 'happens', 'repeated', 'same'];
            
            let lucidScore = lucidTriggers.filter(t => words.map(w => w.toLowerCase()).includes(t)).length;
            let nightmareScore = nightmareTriggers.filter(t => words.map(w => w.toLowerCase()).includes(t)).length;
            let recurringScore = recurringTriggers.filter(t => words.map(w => w.toLowerCase()).includes(t)).length;
            
            if (recurringScore > 1) type = 'Recurring';
            else if (lucidScore > 0 && lucidScore >= nightmareScore) type = 'Lucid';
            else if (nightmareScore > 0) type = 'Nightmare';

            return {
                type,
                people: [...extNames]
            };
        }
    };

    /** --- SYSTEM REGISTRY DATA PLATFORM --- */
    const Store = {
        get() { try { const r = localStorage.getItem('dreams_v8'); return r ? JSON.parse(r).map(d => this.normalize(d)) : []; } catch (e) { return []; } },
        save(d) { const ds = this.get(); ds.unshift(this.normalize(d)); try { localStorage.setItem('dreams_v8', JSON.stringify(ds)); } catch(e) {} },
        delete(id) { const ds = this.get().filter(d => d.id !== id); try { localStorage.setItem('dreams_v8', JSON.stringify(ds)); } catch(e) {} },
        getById(id) { return this.get().find(d => d.id == id); },
        normalize(d) {
            if (!d) d = {};
            return {
                id: d.id || Date.now(), 
                createdAt: d.createdAt || new Date().toISOString(), 
                title: d.title || 'Untitled Stream Sequence', 
                transcript: d.transcript || '', 
                vividness: d.vividness || 5,
                analysis: { 
                    type: d.analysis?.type || 'Normal', 
                    people: Array.isArray(d.analysis?.people) ? d.analysis.people : []
                }, 
                metadata: { deleted: !!d.metadata?.deleted }
            };
        }
    };

    /** --- ANALYTICS FRAMEWORK PROCESSING --- */
    const PatternAnalyzer = {
        extract(dreams) {
            const p = { people: {}, types: { Normal: 0, Lucid: 0, Nightmare: 0, Recurring: 0 } };
            dreams.forEach(d => {
                if (!d.analysis) return;
                const type = d.analysis.type;
                if(p.types[type] !== undefined) p.types[type]++; else p.types['Normal']++;
                ['people'].forEach(cat => {
                    if (Array.isArray(d.analysis[cat])) {
                        d.analysis[cat].forEach(item => { 
                            if(item) { const norm = item.charAt(0).toUpperCase() + item.slice(1).toLowerCase(); p[cat][norm] = (p[cat][norm] || 0) + 1; }
                        });
                    }
                });
            });
            const sortMap = (map) => Object.entries(map).sort((a,b) => b[1] - a[1]).map(([name, count]) => ({name, count}));
            return { types: p.types, people: sortMap(p.people) };
        }
    };

    const AnalyticsModule = {
        render() {
            const v = document.getElementById('viewport'); if(!v) return;
            
            let db = Store.get().filter(d => !d.metadata?.deleted);
            const patterns = PatternAnalyzer.extract(db);
            
            const totalDreams = db.length;
            const types = patterns.types;
            const topPeople = patterns.people.slice(0, 5);
            
            let totalVividness = 0;
            let vCounts = Array(11).fill(0);
            db.forEach(d => {
                let vScore = d.vividness;
                if (!vScore) {
                    let hash = 0;
                    for (let i = 0; i < d.transcript.length; i++) hash = d.transcript.charCodeAt(i) + ((hash << 5) - hash);
                    vScore = (Math.abs(hash) % 10) + 1;
                }
                totalVividness += vScore;
                vCounts[vScore]++;
            });
            let avgVividness = totalDreams ? (totalVividness / totalDreams).toFixed(1) : "0.0";
            
            const vividColors = [
                '#1e1b4b', '#312e81', '#4338ca', '#4f46e5', '#6366f1', 
                '#8b5cf6', '#c084fc', '#06b6d4', '#22d3ee', '#67e8f9'
            ];
            
            let conicStops = [];
            if (totalDreams === 0) {
                conicStops.push(`rgba(255,255,255,0.05) 0% 100%`);
            } else {
                let cumulative = 0;
                for(let i=1; i<=10; i++) {
                    if(vCounts[i] > 0) {
                        let pct = (vCounts[i] / totalDreams) * 100;
                        conicStops.push(`${vividColors[i-1]} ${cumulative}% ${cumulative + pct}%`);
                        cumulative += pct;
                    }
                }
            }
            const pieGradient = conicStops.join(', ');

            v.innerHTML = `
                <div class="max-w-6xl mx-auto pb-20 animate-slide-up">
                    <div class="mb-12 border-b border-white/10 pb-8">
                        <h1 class="text-4xl md:text-5xl font-black tracking-tight text-white mb-2 heading-font">Telemetry Analytics</h1>
                        <p class="text-zinc-400 font-light">Deep neural telemetry array of stored subconscious states and emotional resonance.</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        <div class="glass-card p-10 rounded-[2.5rem] border border-white/5 flex flex-col justify-center relative overflow-hidden group hover:border-white/25 transition-all shadow-[0_20px_40px_rgba(0,0,0,0.4)]">
                            <div class="absolute -right-20 -bottom-20 w-64 h-64 bg-purple-500/20 rounded-full blur-3xl pointer-events-none group-hover:bg-purple-500/30 transition-colors duration-700"></div>
                            <h2 class="text-xs font-mono font-bold uppercase tracking-[0.2em] text-zinc-400 mb-6 flex items-center gap-3">
                                <div class="p-2 bg-purple-500/10 rounded-lg border border-purple-500/30"><i data-lucide="database" class="w-4 h-4 text-purple-400"></i></div> 
                                Total Dreams Captured
                            </h2>
                            <div class="text-7xl md:text-8xl font-black text-white heading-font relative z-10 drop-shadow-lg">${totalDreams}</div>
                        </div>

                        <div class="glass-card p-10 rounded-[2.5rem] border border-white/5 shadow-[0_20px_40px_rgba(0,0,0,0.4)] relative overflow-hidden">
                            <div class="absolute -left-20 -top-20 w-64 h-64 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
                            <h2 class="text-xs font-mono font-bold uppercase tracking-[0.2em] text-zinc-400 mb-6 flex items-center gap-3 relative z-10">
                                <div class="p-2 bg-cyan-500/10 rounded-lg border border-cyan-500/30"><i data-lucide="pie-chart" class="w-4 h-4 text-cyan-400"></i></div>
                                Dream Categories
                            </h2>
                            <div class="grid grid-cols-2 gap-4 relative z-10">
                                <div class="bg-[#030307]/60 backdrop-blur-md border border-white/5 p-5 rounded-2xl flex flex-col justify-between hover:border-cyan-500/30 transition-colors">
                                    <div class="text-3xl font-bold text-white mb-2">${types.Lucid || 0}</div>
                                    <div class="text-[10px] uppercase font-mono font-bold text-cyan-400 tracking-wider">Lucid</div>
                                </div>
                                <div class="bg-[#030307]/60 backdrop-blur-md border border-white/5 p-5 rounded-2xl flex flex-col justify-between hover:border-purple-500/30 transition-colors">
                                    <div class="text-3xl font-bold text-white mb-2">${types.Normal || 0}</div>
                                    <div class="text-[10px] uppercase font-mono font-bold text-purple-400 tracking-wider">Normal</div>
                                </div>
                                <div class="bg-[#030307]/60 backdrop-blur-md border border-white/5 p-5 rounded-2xl flex flex-col justify-between hover:border-rose-500/30 transition-colors">
                                    <div class="text-3xl font-bold text-white mb-2">${types.Nightmare || 0}</div>
                                    <div class="text-[10px] uppercase font-mono font-bold text-rose-400 tracking-wider">Nightmare</div>
                                </div>
                                <div class="bg-[#030307]/60 backdrop-blur-md border border-white/5 p-5 rounded-2xl flex flex-col justify-between hover:border-emerald-500/30 transition-colors">
                                    <div class="text-3xl font-bold text-white mb-2">${types.Recurring || 0}</div>
                                    <div class="text-[10px] uppercase font-mono font-bold text-emerald-400 tracking-wider">Recurring</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="glass-card p-10 rounded-[2.5rem] border border-white/5 shadow-[0_20px_40px_rgba(0,0,0,0.4)]">
                            <h2 class="text-xs font-mono font-bold uppercase tracking-[0.2em] text-zinc-400 mb-6 flex items-center gap-3">
                                <div class="p-2 bg-purple-500/10 rounded-lg border border-purple-500/30"><i data-lucide="users" class="w-4 h-4 text-purple-400"></i></div>
                                Top 5 Entities Noticed
                            </h2>
                            <div class="space-y-4">
                                ${topPeople.length ? topPeople.map((person, idx) => `
                                    <div class="flex justify-between items-center bg-black/40 border border-white/5 p-4 rounded-2xl hover:border-white/10 transition-colors group cursor-default">
                                        <div class="flex items-center gap-4">
                                            <span class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-[10px] font-mono text-zinc-500 border border-white/5 group-hover:text-white transition-colors">0${idx+1}</span>
                                            <span class="text-sm font-medium text-zinc-200 tracking-wide">${person.name}</span>
                                        </div>
                                        <span class="text-[10px] font-mono font-bold text-purple-300 bg-purple-500/10 border border-purple-500/20 px-3 py-1.5 rounded-lg">${person.count} mentions</span>
                                    </div>
                                `).join('') : '<div class="text-sm text-zinc-500 font-mono italic p-8 text-center bg-black/20 rounded-2xl border border-dashed border-white/10">No human entities registered yet.</div>'}
                            </div>
                        </div>

                        <div class="glass-card p-10 rounded-[2.5rem] border border-white/5 flex flex-col justify-between shadow-[0_20px_40px_rgba(0,0,0,0.4)] relative overflow-hidden">
                            <h2 class="text-xs font-mono font-bold uppercase tracking-[0.2em] text-zinc-400 mb-6 flex items-center gap-3 relative z-10">
                                <div class="p-2 bg-emerald-500/10 rounded-lg border border-emerald-500/30"><i data-lucide="aperture" class="w-4 h-4 text-emerald-400"></i></div>
                                Vividness Spectrum
                            </h2>

                                <div class="w-48 h-48 rounded-full shadow-[0_0_50px_rgba(0,0,0,0.6)] relative flex items-center justify-center shrink-0" style="background: conic-gradient(${pieGradient})">
                                    <div class="absolute inset-2 bg-[#030307] rounded-full z-10 flex flex-col items-center justify-center shadow-inner border border-white/5">

                                    ${vividColors.map((color, idx) => `
                                        <div class="flex items-center gap-2">

    };

    const ArchiveModule = {
        render() {
            const v = document.getElementById('viewport');
            const data = Store.get().filter(d => !d.metadata?.deleted);
            
            const categories = [
                { name: 'Lucid Memory Fields', type: 'Lucid', color: 'bg-cyan-400', text: 'text-cyan-400', border: 'border-cyan-500/30', bg: 'bg-cyan-950/40', shadow: 'shadow-[0_15px_40px_rgba(6,182,212,0.15)]', glow: 'from-cyan-500/20' },
                { name: 'Subconscious Fractures / Nightmare', type: 'Nightmare', color: 'bg-rose-500', text: 'text-rose-400', border: 'border-rose-500/30', bg: 'bg-rose-950/40', shadow: 'shadow-[0_15px_40px_rgba(244,63,94,0.15)]', glow: 'from-rose-500/20' },

            ];

            let htmlContent = '';
            
            if (!data.length) {
                htmlContent = `
                    <div class="flex flex-col items-center justify-center py-40 text-center animate-slide-up">
                        <div class="w-20 h-20 rounded-full border-2 border-dashed border-white/20 flex items-center justify-center mb-8 text-zinc-600 animate-[spin_15s_linear_infinite] relative">
                            <div class="absolute inset-0 rounded-full border-t-2 border-purple-500 animate-[spin_3s_linear_infinite]"></div>
                            <i data-lucide="dashed-circle" class="w-8 h-8 opacity-50"></i>
                        </div>
                        <p class="text-sm font-mono text-zinc-400 tracking-[0.2em] max-w-sm mx-auto uppercase leading-loose">ARCHIVE FRAMEWORK EMPTY<br/><span class="text-cyan-400 font-bold opacity-85 mt-2 block">INITIALIZE CORE AUDIO TRANSMISSION</span></p>
                    </div>`;
            } else {

    /** --- RECORD PAGE CORE --- */
    const OrbEngine = {

        audioCtx: null,

        timeoutRef: null,
        
        init(el) {
            el.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center w-full max-w-3xl mx-auto pb-10">

                        <div id="orb-morph-ring"></div>
                        
                        <div id="orb-core" class="orb-core flex items-center justify-center group" onclick="OrbEngine.toggle()">
                            <span id="orb-hint" class="text-[11px] font-mono font-bold text-white/90 group-hover:text-cyan-300 uppercase tracking-[0.2em] transition duration-500 pointer-events-none drop-shadow-[0_0_8px_rgba(255,255,255,0.85)] z-20">CONNECT</span>
                        </div>
                        
                        <div class="morph-content">
                            <div class="reveal-item delay-1 flex justify-between items-center mb-4 border-b border-white/10 pb-4">
                                <div>
                                    <h2 class="text-xl md:text-2xl font-black text-white heading-font tracking-tight drop-shadow-md">Telemetry Synced</h2>

                                </div>
                                <div class="w-10 h-10 rounded-[1rem] bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 shadow-[0_0_20px_rgba(6,182,212,0.2)] backdrop-blur-md">
                                    <i data-lucide="check-square" class="w-5 h-5"></i>
                                </div>
                            </div>
                            
                            <div class="reveal-item delay-2 flex-1 glass-card rounded-[1.5rem] p-4 md:p-5 overflow-y-auto mb-4 border-white/10 bg-black/40 shadow-inner max-h-[140px]">

                                </div>

                                <div class="flex justify-between text-[9px] font-mono text-zinc-500 mt-1.5">
                                    <span>1 (Faint)</span>
                                    <span>10 (Hyper-Vivid)</span>
                                </div>
                            </div>
                            
                            <button onclick="OrbEngine.saveAndRoute()" class="reveal-item delay-3 w-full py-4 rounded-[1.25rem] bg-gradient-to-r from-purple-600 to-cyan-600 text-white font-bold tracking-[0.1em] hover:brightness-125 transition-all duration-300 shadow-[0_10px_40px_rgba(139,92,246,0.4)] hover:shadow-[0_15px_50px_rgba(6,182,212,0.5)] flex items-center justify-center gap-3 text-xs uppercase font-mono transform hover:-translate-y-1">
                                <i data-lucide="shield-alert" class="w-4 h-4"></i> Commit Telemetry Array
                            </button>
                        </div>
                    </div>

                    <div id="live-feedback" class="mt-8 text-center text-xl md:text-2xl font-light text-zinc-300 max-w-2xl w-full h-32 overflow-y-auto scrollbar-hide transition-all duration-700 opacity-0 px-8 translate-y-6 leading-relaxed"></div>
                    
                    <div id="text-stage" class="hidden w-full max-w-3xl mx-auto animate-slide-up flex-col gap-6 mt-6" style="animation-delay: 0.2s">
                        <div class="relative group">
                            <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-[2.5rem] blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                            <textarea id="manual-transcript" class="glass-card w-full h-44 bg-black/60 text-zinc-100 rounded-[2rem] p-6 text-sm md:text-base leading-relaxed tracking-wide resize-none outline-none focus:border-cyan-500/50 focus:ring-4 focus:ring-cyan-500/20 transition-all duration-300 placeholder-zinc-600 font-light relative z-10 shadow-inner" placeholder="Initiate manual entry sequence... Document the entities, emotions, and occurrences..."></textarea>

                                <span id="manual-vividness-value" class="text-base font-black font-mono text-white bg-cyan-500/20 border border-cyan-500/40 px-3 py-1 rounded-xl">5</span>
                            </div>
                            <input type="range" id="manual-vividness-slider" min="1" max="10" value="5" class="w-full cursor-pointer" oninput="document.getElementById('manual-vividness-value').innerText = this.value">
                            <div class="flex justify-between text-[9px] font-mono text-zinc-500 mt-2">
                                <span>1 (Faint)</span>
                                <span>10 (Hyper-Vivid)</span>
                            </div>
                        </div>

                        <button onclick="OrbEngine.saveTextAndRoute()" class="w-full py-5 rounded-[1.5rem] bg-gradient-to-r from-cyan-600 to-purple-600 text-white font-bold tracking-[0.1em] hover:brightness-125 transition-all duration-300 shadow-[0_10px_40px_rgba(6,182,212,0.4)] hover:shadow-[0_15px_50px_rgba(139,92,246,0.5)] flex items-center justify-center gap-3 text-sm uppercase font-mono transform hover:-translate-y-1">
                            <i data-lucide="keyboard" class="w-5 h-5"></i> Commit Manual Telemetry
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
            this.resetState();
            
            const SpeechTarget = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechTarget) {
                document.getElementById('orb-hint').innerText = "VCN_ERR";
            } else {
                this.recognition = new SpeechTarget();
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                
                this.recognition.onresult = (e) => {
                    this.finalTranscript = Array.from(e.results).map(r => r[0].transcript).join('');
                    this.renderLiveText();
                    
                    const mt = document.getElementById('morph-transcript');
                    if(mt) mt.innerText = this.finalTranscript;

                    clearTimeout(this.timeoutRef);
                    this.timeoutRef = setTimeout(() => { if (this.isRecording) this.stop(); }, 8000);
                };

                this.recognition.onend = () => {
                    if(this.isRecording) { try { this.recognition.start(); } catch(e){} }
                };
            }
        },

        resetState() {
            this.isRecording = false;
            this.finalTranscript = '';
            this.displayedWords = [];
            this.activeMode = 'orb';
            if (this.audioAnimFrame) cancelAnimationFrame(this.audioAnimFrame);
            clearTimeout(this.timeoutRef);
        },

        setMode(mode) {
            this.activeMode = mode;
            const btnOrb = document.getElementById('btn-mode-orb');
            const btnText = document.getElementById('btn-mode-text');
            const stageOrb = document.getElementById('orb-stage');
            const stageText = document.getElementById('text-stage');
            const liveFeedback = document.getElementById('live-feedback');

            if (mode === 'orb') {
                btnOrb.className = "px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-purple-500/20 text-purple-300 border border-purple-500/40 shadow-[0_0_20px_rgba(139,92,246,0.2)] hover:bg-purple-500/30";
                btnText.className = "px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-black/40 text-zinc-400 border border-white/10 hover:text-white hover:border-white/20 glass-card";
                
                stageOrb.classList.remove('hidden');
                stageOrb.classList.add('flex');
                stageText.classList.add('hidden');
                stageText.classList.remove('flex');
                liveFeedback.style.display = 'block';
            } else {
                btnText.className = "px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 shadow-[0_0_20px_rgba(6,182,212,0.2)] hover:bg-cyan-500/30";
                btnOrb.className = "px-5 py-2.5 rounded-xl text-[11px] font-mono font-bold uppercase tracking-[0.2em] transition-all duration-300 bg-black/40 text-zinc-400 border border-white/10 hover:text-white hover:border-white/20 glass-card";
                
                stageOrb.classList.add('hidden');
                stageOrb.classList.remove('flex');
                stageText.classList.remove('hidden');
                stageText.classList.add('flex');
                liveFeedback.style.display = 'none';
                
                if (this.isRecording) this.stop();
            }
        },

        renderLiveText() {
            const fb = document.getElementById('live-feedback');
            if(!fb || !this.finalTranscript) return;
            
            const currentWords = this.finalTranscript.trim().split(/\s+/);
            
            if (currentWords.length > this.displayedWords.length) {
                const newWords = currentWords.slice(this.displayedWords.length);
                newWords.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'live-word';
                    span.innerText = w;
                    fb.appendChild(span);
                    fb.appendChild(document.createTextNode(' '));
                });
                this.displayedWords = currentWords;
                fb.scrollTop = fb.scrollHeight;
            } else if (currentWords.length < this.displayedWords.length || (currentWords.length > 0 && currentWords[0] !== this.displayedWords[0])) {
                fb.innerHTML = currentWords.map(w => `<span class="live-word" style="animation:none; opacity:1; filter:blur(0); transform:none;">${w}</span> `).join('');
                this.displayedWords = currentWords;
            } else if (currentWords.length === this.displayedWords.length) {
                const lastSpan = fb.querySelector('.live-word:last-of-type');
                if(lastSpan) lastSpan.innerText = currentWords[currentWords.length - 1];
            }
        },

        async startAudioReactive() {
            try {
                if(!navigator.mediaDevices) return;
                this.audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true, 
                        autoGainControl: true,
                        channelCount: 1 
                    } 
                });
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audioCtx.state === 'suspended') {
                    await this.audioCtx.resume();
                }
                this.analyser = this.audioCtx.createAnalyser();
                this.analyser.fftSize = 256;
                const source = this.audioCtx.createMediaStreamSource(this.audioStream);
                source.connect(this.analyser);
                this.audioData = new Uint8Array(this.analyser.frequencyBinCount);
                this.tickAudio();
            } catch(err) {
                console.warn("Telemetry wave bypassed:", err);
            }
        },

        tickAudio() {
            if(!this.isRecording) return;
            if(this.analyser && this.audioData) {
                this.analyser.getByteFrequencyData(this.audioData);
                let sum = 0; for(let i = 0; i < this.audioData.length; i++) sum += this.audioData[i];
                let avg = sum / this.audioData.length;
                
                const stage = document.getElementById('orb-stage');
                const orb = document.getElementById('orb-core');
                
                if (orb && stage && !stage.classList.contains('is-morphed')) {
                    const volumeScale = 1.05 + (avg / 256) * 0.4; 
                    orb.style.transform = `scale(${volumeScale})`;
                    orb.style.boxShadow = `inset -18px -18px 45px rgba(0,0,0,0.9), inset 18px 18px 45px rgba(255,255,255,0.95), 0 0 ${90 + (avg * 2.2)}px rgba(6, 182, 212, ${0.5 + (avg/140)})`;
                }
            }
            this.audioAnimFrame = requestAnimationFrame(() => this.tickAudio());
        },

        toggle() {
            if(document.getElementById('orb-stage').classList.contains('is-morphed')) return;
            if(!this.isRecording) this.start(); else this.stop();
        },

        start() {
            if(!this.recognition) return;
            this.isRecording = true;
            this.finalTranscript = '';
            this.displayedWords = [];
            
            try {
                this.recognition.start();
                this.startAudioReactive();
            } catch(e) {}
            
            const stage = document.getElementById('orb-stage');
            stage.classList.add('is-listening');
            
            document.getElementById('orb-hint').innerText = "LISTENING";
            document.getElementById('live-feedback').style.opacity = '1';
            document.getElementById('live-feedback').style.transform = 'translateY(0)';
            document.getElementById('live-feedback').innerHTML = '<span class="text-cyan-500/65 text-sm font-mono tracking-[0.2em] animate-pulse">TRANSMISSION STREAM OPEN...</span>';

            this.timeoutRef = setTimeout(() => {
                if(this.isRecording) this.stop();
            }, 15000);
        },

        stop() {
            this.isRecording = false;
            if(this.audioAnimFrame) cancelAnimationFrame(this.audioAnimFrame);
            clearTimeout(this.timeoutRef);
            
            try {
                this.recognition.stop();
                if(this.audioStream) this.audioStream.getTracks().forEach(t => t.stop());
                if(this.audioCtx) this.audioCtx.close();
            } catch(e) {}
            
            const stage = document.getElementById('orb-stage');
            const orbCore = document.getElementById('orb-core');
            
            if (orbCore) {
                orbCore.style.transform = 'none';
                orbCore.style.boxShadow = '';
            }
            
            stage.classList.remove('is-listening');
            requestAnimationFrame(() => {
                stage.classList.add('is-morphed');
            });

            setTimeout(() => { 
                const inst = document.getElementById('orb-instructions');
                if (inst) {
                    inst.style.opacity = '0';
                    inst.style.transform = 'translateY(-20px)';
                    setTimeout(() => inst.style.display = 'none', 400);
                }
            }, 200);
            
            const fb = document.getElementById('live-feedback');
            if (fb) {
                fb.style.opacity = '0';
                fb.style.transform = 'translateY(20px)';
            }
            
            setTimeout(() => {
                const mt = document.getElementById('morph-transcript');
                if (mt) mt.innerText = this.finalTranscript.trim() || "No telemetry stream captured. Neural transmission dropped.";
            }, 50);
        },

        saveTextAndRoute() {
            const manualText = document.getElementById('manual-transcript').value;
            const vividness = parseInt(document.getElementById('manual-vividness-slider')?.value || 5);
            this.processAndSave(manualText, vividness);
        },

        saveAndRoute() {
            const vividness = parseInt(document.getElementById('vividness-slider')?.value || 5);
            this.processAndSave(this.finalTranscript, vividness);
        },

        processAndSave(rawData, vividness = 5) {
            if (rawData.trim()) {
                const analysisResult = NLPEngine.extract(rawData);
                Store.save({
                    title: rawData.slice(0, 40) + (rawData.length > 40 ? '...' : ''), 
                    transcript: rawData, 
                    analysis: analysisResult,
                    vividness: vividness
                });
            }
            Router.navigate('archive');
        }
    };

    /** --- SYSTEM VIEWPORT NAVIGATION ROUTER --- */
    const Router = {
        async navigate(pageId) {
            const v = document.getElementById('viewport'); if(!v) return;
            
            v.classList.remove('fade-in');
            v.classList.add('fade-out');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === pageId));
            
            await new Promise(r => setTimeout(r, 400));
            
            if (pageId === 'record') OrbEngine.init(v);
            else if (pageId === 'archive') ArchiveModule.render();
            else if (pageId === 'analytics') AnalyticsModule.render();
            
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    v.classList.remove('fade-out'); 
                    v.classList.add('fade-in');
                });
            });
        }
    };

    document.getElementById('nav-menu').addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link && link.dataset.page) { 
            e.preventDefault(); 
            Router.navigate(link.dataset.page); 
        }
    });

    Router.navigate('record');
    SystemLock.init();
</script>
</body>
</html>
